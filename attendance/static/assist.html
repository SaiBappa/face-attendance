<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Aura Assist</title>
<style>
  /* ------------------------------------------------------------------ tokens
     Same colour system as Insights. Light is the base; dark is its own set,
     applied by the OS unless the viewer pinned a theme (data-theme). */
  :root {
    color-scheme: light;
    --bg:#f3f4f1; --card:#ffffff; --card2:#f8f8f6; --ink:#0d1015; --ink2:#4a4f57; --muted:#80858c;
    --line:rgba(13,16,21,.09); --hover:rgba(13,16,21,.04);
    --shadow:0 1px 2px rgba(13,16,21,.04), 0 8px 24px -12px rgba(13,16,21,.12);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s7:#4a3aa7;
    --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
    --good-ink:#006300; --bad-ink:#b42525; --warn-ink:#8a5a00;
    --brand1:#12b3a6; --brand2:#7c5cff;
    --glow1:rgba(18,179,166,.10); --glow2:rgba(124,92,255,.09);
    --amber-bg:#fff6e0; --red-bg:#fdeceb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg:#08090c; --card:#111419; --card2:#161a20; --ink:#f3f5f7; --ink2:#b8bdc5; --muted:#7f858e;
      --line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.04);
      --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px -16px rgba(0,0,0,.6);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s7:#9085e9;
      --good-ink:#2fc22f; --bad-ink:#f07171; --warn-ink:#f5c04a;
      --glow1:rgba(18,179,166,.13); --glow2:rgba(124,92,255,.13);
      --amber-bg:#221b0b; --red-bg:#2a1213;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#08090c; --card:#111419; --card2:#161a20; --ink:#f3f5f7; --ink2:#b8bdc5; --muted:#7f858e;
    --line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.04);
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px -16px rgba(0,0,0,.6);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s7:#9085e9;
    --good-ink:#2fc22f; --bad-ink:#f07171; --warn-ink:#f5c04a;
    --glow1:rgba(18,179,166,.13); --glow2:rgba(124,92,255,.13);
    --amber-bg:#221b0b; --red-bg:#2a1213;
  }

  /* ------------------------------------------------------------------ base
     rem-based so the whole board scales up on a wall TV and down on a phone */
  html { font-size:clamp(15px, .5vw + 8.5px, 19px); -webkit-text-size-adjust:100%; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; color:var(--ink); font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh; overflow-x:hidden;
         background:radial-gradient(1100px 480px at 8% -8%, var(--glow1), transparent 60%), radial-gradient(900px 420px at 95% -12%, var(--glow2), transparent 60%), var(--bg);
         background-attachment:fixed; }
  button, input, select, textarea { font:inherit; color:inherit; }
  .num { font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); }
  :focus-visible { outline:2px solid var(--brand2); outline-offset:2px; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; min-height:2.35rem; padding:0 .8rem; border-radius:.65rem;
         border:1px solid var(--line); background:var(--card); cursor:pointer; font-size:.9rem; font-weight:550; text-decoration:none; white-space:nowrap; }
  .btn:hover { background:var(--card2); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn svg { width:1.05rem; height:1.05rem; flex:none; }
  .btn.icon { width:2.35rem; padding:0; }
  .btn.primary { background:linear-gradient(135deg,var(--brand1),var(--brand2)); color:#fff; border-color:transparent; }
  .btn.primary:hover { filter:brightness(1.07); }
  .btn.go { background:var(--s3); color:#fff; border-color:transparent; }
  .btn.go:hover { filter:brightness(1.08); }
  .btn.ghost { background:transparent; }
  .btn.bad { color:var(--bad-ink); }
  .btn.on { border-color:color-mix(in srgb, var(--brand2) 45%, var(--line)); background:color-mix(in srgb, var(--brand2) 10%, var(--card)); }
  .btn.attn { border-color:color-mix(in srgb, var(--warn) 70%, transparent); background:color-mix(in srgb, var(--warn) 16%, var(--card)); }
  input[type=text], input[type=password], textarea { border:1px solid var(--line); background:var(--card); border-radius:.65rem; padding:0 .7rem; min-height:2.35rem; min-width:0; }
  textarea { padding:.5rem .7rem; resize:vertical; width:100%; min-height:4.2rem; }

  /* ------------------------------------------------------------------ header */
  header { position:sticky; top:0; z-index:20; backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px);
           background:color-mix(in srgb, var(--bg) 80%, transparent); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top); }
  .bar { max-width:2200px; margin:0 auto; padding:.7rem 1.25rem; display:flex; flex-wrap:wrap; gap:.6rem 1rem; align-items:center; }
  .brand { display:flex; gap:.7rem; align-items:center; margin-right:auto; min-width:0; }
  .brand svg { width:2.1rem; height:2.1rem; flex:none; }
  .brand h1 { margin:0; font-size:1.2rem; letter-spacing:-.01em; font-weight:700; white-space:nowrap; }
  .brand p { margin:0; font-size:.8rem; color:var(--muted); display:flex; align-items:center; gap:.4rem; white-space:nowrap; }
  .live { width:.55rem; height:.55rem; border-radius:50%; background:var(--good); box-shadow:0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); animation:pulse 2s infinite; }
  .live.off { background:var(--crit); animation:none; }
  @keyframes pulse { 70% { box-shadow:0 0 0 .45rem transparent; } 100% { box-shadow:0 0 0 0 transparent; } }
  .clock { font-size:1.35rem; font-weight:650; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .ctrls { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
  .me { display:flex; align-items:center; gap:.4rem; padding:.2rem .2rem .2rem .7rem; border:1px solid var(--line); border-radius:.75rem; background:var(--card); }
  .me label { font-size:.78rem; color:var(--muted); white-space:nowrap; }
  .me input { border:0; background:transparent; min-height:2rem; width:10rem; padding:0 .4rem; font-weight:600; }
  .me.need { border-color:var(--warn); box-shadow:0 0 0 3px color-mix(in srgb, var(--warn) 30%, transparent); }

  #offline { max-width:2200px; margin:.6rem auto 0; padding:0 1.25rem; }
  #offline div { padding:.6rem .9rem; border-radius:.7rem; background:var(--red-bg); color:var(--bad-ink); font-weight:600; font-size:.9rem; }

  /* ------------------------------------------------------------------ summary strip */
  main { max-width:2200px; margin:0 auto; padding:1rem 1.25rem 4rem; }
  /* supervisor alerts rail */
  #sup { margin:0 0 1.1rem; border:1px solid var(--line); border-radius:1rem; background:var(--card); box-shadow:var(--shadow); }
  #sup summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:.6rem; padding:.7rem 1rem; font-weight:650; font-size:.95rem; }
  #sup summary::-webkit-details-marker { display:none; }
  #sup summary::after { content:"▾"; margin-left:auto; color:var(--muted); transition:transform .2s; }
  #sup[open] summary::after { transform:rotate(180deg); }
  #sup .sn { min-width:1.5rem; height:1.5rem; padding:0 .4rem; border-radius:99px; display:inline-grid; place-items:center; background:var(--crit); color:#fff; font-size:.78rem; font-weight:700; }
  #sup .sn.zero { background:var(--hover); color:var(--muted); }
  #sup .sl { display:grid; gap:.4rem; padding:0 1rem .9rem; }
  #sup .si { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:.6rem; align-items:center; padding:.5rem .7rem; border-radius:.7rem; background:var(--card2); border-left:3px solid var(--muted); font-size:.88rem; }
  #sup .si .sa { display:flex; gap:.35rem; }
  #sup .si .sa .btn { min-height:1.9rem; padding:0 .6rem; font-size:.8rem; }
  @media (max-width:640px) { #sup .si { grid-template-columns:auto minmax(0,1fr) auto; } #sup .si .sa { grid-column:1 / -1; justify-content:flex-end; } }
  #sup .si.high { border-left-color:var(--crit); } #sup .si.medium { border-left-color:var(--warn); } #sup .si.low { border-left-color:var(--s1); }
  #sup .si small { color:var(--muted); white-space:nowrap; }
  #sup .si.ack { opacity:.7; }
  .strip { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:.8rem; margin-bottom:1.1rem; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:1rem; padding:.8rem 1rem; box-shadow:var(--shadow); min-width:0; }
  .stat .l { font-size:.8rem; color:var(--ink2); font-weight:550; display:flex; align-items:center; gap:.4rem; }
  .stat .l i { width:.6rem; height:.6rem; border-radius:3px; display:inline-block; }
  .stat .v { font-size:2.1rem; font-weight:680; letter-spacing:-.02em; line-height:1.1; margin-top:.2rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .stat .v small { font-size:.95rem; font-weight:500; color:var(--muted); margin-left:.2rem; }
  .stat .d { font-size:.78rem; color:var(--muted); margin-top:.2rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat.hot { border-color:color-mix(in srgb, var(--crit) 50%, var(--line)); background:linear-gradient(var(--red-bg), var(--card)); }
  .stat.hot .v { color:var(--bad-ink); }

  /* ------------------------------------------------------------------ lanes */
  .lanes { display:grid; grid-template-columns:1fr 1fr; gap:1.1rem; align-items:start; }
  .lanes.three { grid-template-columns:1.1fr 1fr .9fr; }
  .lane { min-width:0; }
  .lane-h { display:flex; align-items:center; gap:.6rem; margin:0 0 .7rem; padding:0 .2rem; }
  .lane-h h2 { margin:0; font-size:.85rem; font-weight:750; letter-spacing:.09em; text-transform:uppercase; color:var(--ink2); }
  .lane-h .n { min-width:1.7rem; height:1.7rem; padding:0 .45rem; border-radius:99px; display:inline-grid; place-items:center; font-size:.85rem; font-weight:700; color:#fff; font-variant-numeric:tabular-nums; }
  .lane-h .hint { margin-left:auto; font-size:.78rem; color:var(--muted); }
  .cards { display:grid; gap:.8rem; }
  .none { border:1.5px dashed var(--line); border-radius:1.1rem; padding:2.2rem 1rem; text-align:center; color:var(--muted); font-size:.95rem; }
  .none b { display:block; font-size:1.6rem; margin-bottom:.3rem; }

  /* ------------------------------------------------------------------ request card */
  .req { --acc:var(--line); position:relative; background:var(--card); border:1px solid var(--line); border-radius:1.1rem; box-shadow:var(--shadow);
         padding:1rem 1.1rem 1rem 1.35rem; overflow:hidden; transition:border-color .3s, background .3s; }
  .req::before { content:""; position:absolute; left:0; top:0; bottom:0; width:.3rem; background:var(--acc); transition:background .3s; }
  .req.open { --acc:var(--s2); }
  .req.ack { --acc:var(--s1); }
  .req.amber { --acc:var(--warn); border-color:color-mix(in srgb, var(--warn) 55%, var(--line)); background:linear-gradient(90deg, var(--amber-bg), var(--card) 70%); }
  .req.red { --acc:var(--crit); border-color:color-mix(in srgb, var(--crit) 55%, var(--line)); background:linear-gradient(90deg, var(--red-bg), var(--card) 70%); }
  .req.red.open { animation:alarm 2.4s ease-in-out infinite; }
  @keyframes alarm { 50% { box-shadow:0 0 0 3px color-mix(in srgb, var(--crit) 28%, transparent), var(--shadow); } }
  .req.fresh { animation:fresh 1s ease-in-out 5; }
  @keyframes fresh { 50% { box-shadow:0 0 0 4px color-mix(in srgb, var(--s2) 55%, transparent), 0 0 32px -4px var(--s2); transform:scale(1.012); } }
  .rq-top { display:grid; grid-template-columns:auto 1fr auto; gap:.9rem; align-items:center; }
  .ico { width:3.3rem; height:3.3rem; border-radius:.9rem; display:grid; place-items:center; font-size:1.95rem; line-height:1; background:var(--card2); border:1px solid var(--line); }
  .rq-t { min-width:0; }
  .rq-t h3 { margin:0; font-size:1.2rem; font-weight:700; letter-spacing:-.01em; line-height:1.2; overflow-wrap:anywhere; }
  .rq-t .loc { margin-top:.15rem; font-size:.95rem; color:var(--ink2); font-weight:550; overflow-wrap:anywhere; }
  .timer { text-align:right; }
  .timer b { display:block; font-size:1.7rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.01em; line-height:1.05; }
  .timer small { display:block; font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:650; margin-top:.15rem; white-space:nowrap; }
  .req.amber .timer b { color:var(--warn-ink); }
  .req.red .timer b { color:var(--bad-ink); }
  .tags { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.75rem; }
  .tag { display:inline-flex; align-items:center; gap:.3rem; padding:.18rem .55rem; border-radius:.45rem; font-size:.78rem; font-weight:600; border:1px solid var(--line); background:var(--card2); color:var(--ink2); white-space:nowrap; }
  .tag.lang { color:#fff; background:var(--s7); border-color:transparent; }
  .tag.lang b { font-weight:800; letter-spacing:.06em; }
  .tag.who { color:var(--s1); }
  .tag.staff { color:var(--good-ink); }
  .details { margin:.7rem 0 0; font-size:1.02rem; line-height:1.45; padding:.55rem .75rem; border-radius:.7rem; background:var(--card2); border:1px solid var(--line); overflow-wrap:anywhere; }
  .details::before { content:"“"; color:var(--muted); margin-right:.1rem; }
  .details::after { content:"”"; color:var(--muted); }
  .notes { margin:.55rem 0 0; font-size:.88rem; color:var(--ink2); overflow-wrap:anywhere; }
  .notes b { color:var(--muted); font-weight:650; font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; margin-right:.3rem; }
  .acts { display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.85rem; align-items:center; }
  .acts .sp { flex:1; }
  .acts .btn.big { min-height:2.8rem; padding:0 1.1rem; font-size:1rem; font-weight:650; }
  .noted { display:grid; gap:.45rem; margin-top:.7rem; }
  .noted .row { display:flex; gap:.45rem; justify-content:flex-end; }

  /* closed today */
  .closed { display:grid; gap:.5rem; }
  .crow { display:grid; grid-template-columns:auto 1fr auto; gap:.3rem .7rem; align-items:center; padding:.65rem .8rem; border-radius:.85rem; background:var(--card); border:1px solid var(--line); }
  .crow .ci { font-size:1.4rem; }
  .crow .ct { min-width:0; }
  .crow .ct b { font-size:.95rem; }
  .crow .ct div { font-size:.8rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crow .cm { text-align:right; font-size:.8rem; color:var(--ink2); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .pill { display:inline-block; padding:.08rem .5rem; border-radius:99px; font-size:.72rem; font-weight:700; }
  .pill.done { color:var(--good-ink); background:color-mix(in srgb, var(--good) 13%, transparent); }
  .pill.cancelled { color:var(--muted); background:var(--hover); border:1px solid var(--line); }
  .pill.late { color:var(--bad-ink); background:color-mix(in srgb, var(--crit) 12%, transparent); }
  .crow .btn { min-height:1.9rem; font-size:.8rem; padding:0 .55rem; }

  /* ------------------------------------------------------------------ gate + toast */
  #gate { max-width:380px; margin:12vh auto 0; padding:0 16px; text-align:center; }
  #gate .box { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px 24px; box-shadow:var(--shadow); }
  #gate svg { width:56px; height:56px; }
  #gate h1 { margin:10px 0 4px; font-size:22px; }
  #gate input { width:100%; height:52px; font-size:26px; text-align:center; letter-spacing:.35em; margin:18px 0 12px; }
  #gate .btn { width:100%; height:44px; }
  .err { color:var(--bad-ink); font-size:14px; min-height:20px; margin:10px 0 0; }
  #toast { position:fixed; left:50%; bottom:max(1.2rem, env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:60; max-width:calc(100vw - 32px);
           padding:.65rem 1rem; border-radius:.8rem; background:var(--ink); color:var(--bg); font-size:.92rem; font-weight:550; box-shadow:0 12px 32px -8px rgba(0,0,0,.35); }
  #toast.bad { background:var(--crit); color:#fff; }

  /* ------------------------------------------------------------------ responsive */
  @media (max-width:1400px) { .lanes.three { grid-template-columns:1fr 1fr; } .lanes.three > .lane:last-child { grid-column:1/-1; } }
  @media (max-width:1100px) { .strip { grid-template-columns:repeat(3,minmax(0,1fr)); } .strip .stat:nth-child(n+4) { display:none; } }
  @media (max-width:820px) {
    .lanes, .lanes.three { grid-template-columns:1fr; }
    .bar { padding:.6rem .9rem; } main { padding:.8rem .9rem 3rem; }
    header { position:static; }
    .ctrls { width:100%; }
    .me { flex:1 1 100%; } .me input { flex:1; width:auto; }
    .hide-sm { display:none; }
  }
  @media (max-width:480px) {
    .strip { grid-template-columns:repeat(3,minmax(0,1fr)); gap:.45rem; }
    .stat { padding:.6rem .65rem; border-radius:.8rem; }
    .stat .v { font-size:1.6rem; }
    .stat .d { display:none; }
    .rq-top { grid-template-columns:auto 1fr; }
    .timer { grid-column:1/-1; text-align:left; display:flex; align-items:baseline; gap:.5rem; }
    .timer b { font-size:1.4rem; }
    .clock, .hide-xs { display:none; }
    .ctrls { gap:.4rem; } .ctrls .btn { padding:0 .6rem; }
  }
  @media (prefers-reduced-motion:reduce) { .req.red.open, .req.fresh, .live { animation:none; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="auraG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12b3a6"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <symbol id="aura" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="17" fill="none" stroke="url(#auraG)" stroke-width="3.2"/>
      <circle cx="20" cy="20" r="10.5" fill="none" stroke="url(#auraG)" stroke-width="2.2" opacity=".55"/>
      <circle cx="20" cy="20" r="4.2" fill="url(#auraG)"/>
    </symbol>
  </defs>
</svg>

<div id="gate" hidden>
  <div class="box">
    <svg><use href="#aura"/></svg>
    <h1>Aura Assist</h1>
    <p class="muted" style="margin:0">Enter the service-desk PIN to open the live board</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN">
    <button class="btn primary" id="pinGo">Open board</button>
    <p id="pinErr" class="err"></p>
  </div>
</div>

<div id="app" hidden>
<header>
  <div class="bar">
    <div class="brand">
      <svg aria-hidden="true"><use href="#aura"/></svg>
      <div><h1>Aura Assist</h1><p><span class="live" id="live"></span><span id="liveTxt">Live</span></p></div>
    </div>
    <div class="clock hide-sm" id="clock" aria-hidden="true"></div>
    <div class="ctrls">
      <div class="me" id="meBox"><label for="me">I am</label><input id="me" type="text" list="staffList" placeholder="Your name" autocomplete="off"><datalist id="staffList"></datalist></div>
      <button class="btn attn" id="sound" title="Play a chime for new requests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span>Enable sound</span></button>
      <button class="btn" id="notify" hidden title="Desktop alerts for new requests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="hide-sm">Alerts</span></button>
      <button class="btn" id="closedBtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Closed<span class="hide-xs">&nbsp;today</span></button>
      <button class="btn icon" id="theme" title="Toggle theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
      <button class="btn icon" id="lock" title="Lock" aria-label="Lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
    </div>
  </div>
</header>
<div id="offline" hidden><div>⚠ Connection lost — retrying… (times shown may be stale)</div></div>

<main>
  <details id="sup" hidden><summary><span aria-hidden="true">🔔</span>Supervisor alerts <span class="sn zero" id="supN">0</span><span class="muted" style="font-weight:500;font-size:.8rem" id="supSub"></span></summary><div class="sl" id="supList"></div></details>
  <section class="strip" id="strip" aria-label="Summary"></section>
  <div class="lanes" id="lanes">
    <section class="lane" aria-labelledby="hWait">
      <div class="lane-h"><span class="n" id="nWait" style="background:var(--s2)">0</span><h2 id="hWait">Waiting</h2><span class="hint" id="slaHint"></span></div>
      <div class="cards" id="wait"></div>
    </section>
    <section class="lane" aria-labelledby="hAck">
      <div class="lane-h"><span class="n" id="nAck" style="background:var(--s1)">0</span><h2 id="hAck">On it</h2></div>
      <div class="cards" id="ack"></div>
    </section>
    <section class="lane" id="closedLane" aria-labelledby="hClosed" hidden>
      <div class="lane-h"><span class="n" id="nClosed" style="background:var(--s3)">0</span><h2 id="hClosed">Closed today</h2></div>
      <div class="closed" id="closed"></div>
    </section>
  </div>
</main>
</div>
<div id="toast" role="status" hidden></div>

<script>
(() => {
  'use strict';

  // ============================================================== helpers
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }
  };
  const qs = new URLSearchParams(location.search);
  const SLA_OVERRIDE = Number(qs.get('sla')) || 0;               // ?sla=N beats the server's ASSIST_SLA_MINUTES
  let SLA = Math.max(1, SLA_OVERRIDE || 5);                      // minutes; amber after SLA, red after 2×SLA
  const POLL = 4000;
  const SOURCE = { button: 'Help button', conversation: 'Asked Aura' };
  let langDN = null;
  try { langDN = new Intl.DisplayNames(['en'], { type: 'language' }); } catch (e) { /* older Safari */ }
  const langName = c => { if (!c) return ''; if (c === 'dv') return 'Dhivehi'; try { return langDN ? langDN.of(c) : c; } catch (e) { return c; } };
  // timestamps are naive local ISO strings from the server; parse both sides the same way
  const tms = s => s ? Date.parse(s.length === 10 ? s + 'T00:00:00' : s) : NaN;
  const dur = ms => {
    if (!(ms >= 0)) ms = 0;
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    return h ? `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${m}:${String(ss).padStart(2, '0')}`;
  };
  const durMin = m => m == null ? '—' : m < 1 ? `${Math.round(m * 60)}s` : m < 60 ? `${m < 10 ? m.toFixed(1).replace(/\.0$/, '') : Math.round(m)}m` : `${Math.floor(m / 60)}h ${String(Math.round(m % 60)).padStart(2, '0')}m`;
  const clockOf = s => s ? s.slice(11, 16) : '';
  const median = xs => { if (!xs.length) return null; const a = [...xs].sort((x, y) => x - y), i = a.length >> 1; return a.length % 2 ? a[i] : (a[i - 1] + a[i]) / 2; };
  const first = n => String(n || '').trim().split(/\s+/)[0];

  let toastT;
  function toast(msg, bad) {
    const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200);
  }

  // ============================================================== state + API
  let PIN = sessionStorage.getItem('pin') || '';
  const S = { rows: [], closed: [], kinds: {}, staff: [], skew: 0, today: '', showClosed: store.get('assist-closed') === '1',
              seen: null, fresh: {}, editing: {}, drafts: {}, pollT: null, busy: false, fails: 0 };
  const serverNow = () => Date.now() + S.skew;

  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { 'X-Admin-Pin': PIN, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
    if (r.status === 401) { lock('Wrong PIN'); throw new Error('unauthorised'); }
    if (!r.ok) { let m = r.statusText; try { m = (await r.json()).error || m; } catch (e) { /* not json */ } throw new Error(m); }
    return r.json();
  }

  async function poll() {
    clearTimeout(S.pollT);
    try {
      // one call: live requests of any date + everything closed today (server's today; local date until we know it)
      const day = S.today || new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      const live = await api(`/api/requests?status=open,acknowledged,done,cancelled&from=${day}&to=${day}`);
      S.skew = tms(live.now) - Date.now();
      S.today = live.now.slice(0, 10);
      if (!SLA_OVERRIDE && live.sla_min) SLA = Math.max(1, Number(live.sla_min));
      const closed = { rows: live.rows.filter(r => (r.status === 'done' || r.status === 'cancelled') && r.day === S.today) };
      live.rows = live.rows.filter(r => r.status === 'open' || r.status === 'acknowledged');
      S.kinds = live.kinds || {};
      if (S.staff.join('|') !== (live.staff || []).join('|')) {
        S.staff = live.staff || [];
        $('#staffList').innerHTML = S.staff.map(n => `<option value="${esc(n)}">`).join('');
      }
      detectNew(live.rows);
      S.rows = live.rows; S.closed = closed.rows;
      $('#gate').hidden = true; $('#app').hidden = false;
      S.fails = 0; setLive(true);
      render();
    } catch (e) {
      if (e.message === 'unauthorised') return;
      if (++S.fails >= 2) setLive(false);
    }
    S.pollT = setTimeout(poll, POLL);
  }
  function setLive(ok) {
    $('#live').classList.toggle('off', !ok);
    $('#liveTxt').textContent = ok ? `Live · updates every ${POLL / 1000}s` : 'Offline';
    $('#offline').hidden = ok;
  }

  // ============================================================== new-request alerts
  function detectNew(rows) {
    const ids = new Set(rows.map(r => r.id));
    if (S.seen) {
      const fresh = rows.filter(r => r.status === 'open' && !S.seen.has(r.id));
      if (fresh.length) {
        fresh.forEach(r => S.fresh[r.id] = Date.now() + 6000);
        chime();
        notify(fresh);
      }
    }
    S.seen = S.seen ? new Set([...S.seen, ...ids]) : ids;
  }

  let actx = null;
  const soundWanted = () => store.get('assist-sound') !== 'off';
  function unlockAudio() {
    if (!soundWanted()) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state !== 'running') actx.resume().then(soundUI, soundUI);
    } catch (e) { actx = null; }
    soundUI();
  }
  function chime(urgent) {
    if (!actx || actx.state !== 'running' || !soundWanted()) return;
    const t0 = actx.currentTime + .02, notes = urgent ? [880, 698.5, 880] : [659.3, 880, 1318.5];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i * .16;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.22, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .55);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .6);
    });
  }
  function soundUI() {
    const b = $('#sound'), on = soundWanted() && actx && actx.state === 'running';
    b.classList.toggle('attn', soundWanted() && !on);
    b.classList.toggle('on', !!on);
    b.querySelector('span').textContent = !soundWanted() ? 'Sound off' : on ? 'Sound on' : 'Enable sound';
  }
  $('#sound').addEventListener('click', () => {
    const running = actx && actx.state === 'running';
    if (soundWanted() && running) { store.set('assist-sound', 'off'); soundUI(); toast('Chime muted'); return; }
    store.set('assist-sound', null);
    unlockAudio();
    setTimeout(() => { chime(); soundUI(); }, 60);
  });
  // any tap on the page also unlocks audio (browsers need a gesture)
  addEventListener('pointerdown', () => { if (!actx || actx.state !== 'running') unlockAudio(); }, { passive: true });

  function notifyUI() {
    const b = $('#notify');
    b.hidden = !('Notification' in window) || Notification.permission !== 'default';
  }
  $('#notify').addEventListener('click', async () => { try { await Notification.requestPermission(); } catch (e) { /* ignore */ } notifyUI(); });
  function notify(fresh) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    fresh.slice(0, 3).forEach(r => {
      const k = S.kinds[r.kind] || { icon: '💬', label: r.kind };
      try {
        const n = new Notification(`${k.icon} ${k.label}`, { body: `${placeOf(r)}${r.lang ? ' · speaks ' + langName(r.lang) : ''}${r.details ? '\n' + r.details : ''}`, tag: 'assist-' + r.id });
        n.onclick = () => { focus(); n.close(); };
      } catch (e) { /* some browsers only allow notifications from a service worker */ }
    });
  }

  // ============================================================== render
  const placeOf = r => r.location || r.kiosk || '—';
  const kindOf = r => S.kinds[r.kind] || { icon: '💬', label: r.kind || 'Request' };

  function cardHtml(r) {
    const k = kindOf(r), open = r.status === 'open', me = first(S.me), mine = r.assigned_to && S.me && r.assigned_to.toLowerCase() === S.me.toLowerCase();
    const since = open ? r.ts : (r.ack_ts || r.ts);
    const tags = [];
    if (r.lang) tags.push(`<span class="tag lang" title="The traveller speaks ${esc(langName(r.lang))}"><b>${esc(r.lang.toUpperCase())}</b>${esc(langName(r.lang))}</span>`);
    tags.push(`<span class="tag">${r.source === 'conversation' ? '💬' : '🛎'} ${esc(SOURCE[r.source] || r.source || 'Help button')}</span>`);
    if (r.person) tags.push(`<span class="tag staff" title="Raised by an enrolled staff member">🪪 Raised by ${esc(r.person)}</span>`);
    tags.push(`<span class="tag">#${esc(r.id)} · ${esc(clockOf(r.ts))}</span>`);
    if (!open && r.assigned_to) tags.unshift(`<span class="tag who">👤 ${esc(r.assigned_to)}</span>`);
    let acts;
    if (open) acts = `<button class="btn primary big" data-act="take">✋ I'm on it${me ? ` <span style="opacity:.8;font-weight:500">(${esc(me)})</span>` : ''}</button>
        <button class="btn go" data-act="done">Done</button><span class="sp"></span>
        <button class="btn ghost" data-act="note">Note</button><button class="btn ghost bad" data-act="cancel">Cancel</button>`;
    else acts = `<button class="btn go big" data-act="done">✓ Done</button>${!mine ? `<button class="btn" data-act="take">Take over</button>` : ''}
        <span class="sp"></span><button class="btn ghost" data-act="note">Note</button><button class="btn ghost" data-act="reopen">Reopen</button><button class="btn ghost bad" data-act="cancel">Cancel</button>`;
    const ed = S.editing[r.id] ? `<div class="noted"><textarea data-note aria-label="Note" placeholder="e.g. Wheelchair on the way from gate 4">${esc(S.drafts[r.id] ?? r.notes ?? '')}</textarea>
        <div class="row"><button class="btn ghost" data-act="note-x">Close</button><button class="btn primary" data-act="note-save">Save note</button></div></div>` : '';
    return `<article class="req ${open ? 'open' : 'ack'}" data-id="${r.id}">
      <div class="rq-top">
        <div class="ico" aria-hidden="true">${esc(k.icon)}</div>
        <div class="rq-t"><h3>${esc(k.label)}</h3><div class="loc">📍 ${esc(placeOf(r))}${r.location && r.location !== r.kiosk ? ` <span class="muted" style="font-weight:500">· ${esc(r.kiosk)}</span>` : ''}</div></div>
        <div class="timer"><b data-since="${esc(since)}" data-mode="${open ? 'open' : 'ack'}" data-ts="${esc(r.ts)}">0:00</b><small>${open ? 'waiting' : 'on it for'}</small></div>
      </div>
      <div class="tags">${tags.join('')}</div>
      ${r.details ? `<p class="details">${esc(r.details)}</p>` : ''}
      ${r.notes && !S.editing[r.id] ? `<p class="notes"><b>Note</b>${esc(r.notes)}</p>` : ''}
      ${ed}
      <div class="acts">${acts}</div>
    </article>`;
  }

  // keyed update: only cards whose content changed are replaced, so timers,
  // animations and a half-typed note survive the 4-second poll
  function syncLane(el, rows, emptyHtml) {
    if (!rows.length) { if (!el.querySelector('.none')) el.innerHTML = emptyHtml; return; }
    el.querySelector('.none')?.remove();
    const want = rows.map(r => String(r.id));
    const have = new Map([...el.children].map(c => [c.dataset.id, c]));
    for (const [id, c] of have) if (!want.includes(id)) c.remove();
    let prev = null;
    rows.forEach(r => {
      const id = String(r.id), html = cardHtml(r);
      let c = have.get(id);
      if (c && c.parentNode && c._html !== html && !(S.editing[r.id] && c.contains(document.activeElement))) {
        const tmp = document.createElement('div'); tmp.innerHTML = html; const n = tmp.firstElementChild;
        n._html = html; c.replaceWith(n); c = n;
      } else if (!c || !c.parentNode) {
        const tmp = document.createElement('div'); tmp.innerHTML = html; c = tmp.firstElementChild; c._html = html;
      }
      if (S.fresh[r.id] > Date.now()) c.classList.add('fresh');
      const at = prev ? prev.nextElementSibling : el.firstElementChild;
      if (at !== c) el.insertBefore(c, at);
      prev = c;
    });
  }

  function render() {
    const wait = S.rows.filter(r => r.status === 'open').sort((a, b) => tms(a.ts) - tms(b.ts) || a.id - b.id);
    const ack = S.rows.filter(r => r.status === 'acknowledged').sort((a, b) => tms(a.ack_ts || a.ts) - tms(b.ack_ts || b.ts));
    $('#nWait').textContent = wait.length; $('#nAck').textContent = ack.length;
    $('#slaHint').textContent = `amber after ${SLA} min · red after ${SLA * 2}`;
    syncLane($('#wait'), wait, '<div class="none"><b>✓</b>No one is waiting</div>');
    syncLane($('#ack'), ack, '<div class="none">Nobody is on a request right now</div>');
    renderClosed();
    renderStrip(wait, ack);
    document.title = wait.length ? `(${wait.length}) Waiting · Aura Assist` : 'Aura Assist';
    tick();
  }

  function renderClosed() {
    $('#closedLane').hidden = !S.showClosed;
    $('#lanes').classList.toggle('three', S.showClosed);
    $('#closedBtn').classList.toggle('on', S.showClosed);
    $('#closedBtn').setAttribute('aria-pressed', S.showClosed);
    const rows = [...S.closed].sort((a, b) => tms(b.done_ts || b.ts) - tms(a.done_ts || a.ts));
    $('#nClosed').textContent = rows.length;
    if (!S.showClosed) return;
    $('#closed').innerHTML = rows.length ? rows.map(r => {
      const k = kindOf(r), resp = r.ack_ts ? (tms(r.ack_ts) - tms(r.ts)) / 60000 : null, reso = r.done_ts ? (tms(r.done_ts) - tms(r.ts)) / 60000 : null;
      return `<div class="crow">
        <span class="ci" aria-hidden="true">${esc(k.icon)}</span>
        <div class="ct"><b>${esc(k.label)}</b> <span class="pill ${esc(r.status)}">${r.status === 'done' ? 'Done' : 'Cancelled'}</span>
          <div>📍 ${esc(placeOf(r))} · ${esc(clockOf(r.ts))}${r.assigned_to ? ` · ${esc(r.assigned_to)}` : ''}${r.lang ? ` · ${esc(r.lang.toUpperCase())}` : ''}</div>
          ${r.notes ? `<div title="${esc(r.notes)}">📝 ${esc(r.notes)}</div>` : ''}</div>
        <div class="cm">${resp != null ? `<div>response <b class="${resp > SLA ? 'pill late' : ''}">${durMin(resp)}</b></div>` : ''}
          ${reso != null ? `<div>${r.status === 'done' ? 'resolved' : 'closed'} in <b>${durMin(reso)}</b></div>` : ''}
          <button class="btn ghost" data-act="reopen" data-id="${r.id}">Reopen</button></div>
      </div>`;
    }).join('') : '<div class="none">Nothing closed yet today</div>';
  }

  function renderStrip(wait, ack) {
    const now = serverNow();
    const all = [...S.rows, ...S.closed].filter(r => (r.ts || '').slice(0, 10) === S.today);
    const resp = all.filter(r => r.ack_ts).map(r => (tms(r.ack_ts) - tms(r.ts)) / 60000);
    const within = resp.length ? Math.round(100 * resp.filter(m => m <= SLA).length / resp.length) : null;
    const oldest = wait.length ? now - tms(wait[0].ts) : 0;
    const late = wait.filter(r => now - tms(r.ts) > SLA * 60000).length;
    const done = S.closed.filter(r => r.status === 'done').length;
    const med = median(resp);
    const tiles = [
      { l: 'Waiting', c: 'var(--s2)', v: wait.length, d: wait.length ? `oldest <span data-oldest>${dur(oldest)}</span>${late ? ` · ${late} over ${SLA} min` : ''}` : 'all clear', hot: late > 0 },
      { l: 'On it', c: 'var(--s1)', v: ack.length, d: ack.length ? [...new Set(ack.map(r => first(r.assigned_to)).filter(Boolean))].slice(0, 3).join(', ') || 'unassigned' : 'no active requests' },
      { l: 'Median response', c: 'var(--s7)', v: med == null ? '—' : durMin(med), d: `today · ${resp.length} responded` },
      { l: `Within ${SLA}-min SLA`, c: within == null ? 'var(--muted)' : within >= 90 ? 'var(--good)' : within >= 70 ? 'var(--warn)' : 'var(--crit)', v: within == null ? '—' : `${within}<small>%</small>`, d: 'of today’s responses' },
      { l: 'Done today', c: 'var(--s3)', v: done, d: `${S.closed.length - done} cancelled` }
    ];
    $('#strip').innerHTML = tiles.map(t => `<div class="stat${t.hot ? ' hot' : ''}"><div class="l"><i style="background:${t.c}"></i>${esc(t.l)}</div><div class="v">${t.v}</div><div class="d">${t.d}</div></div>`).join('');
  }

  // 1-second ticker: timers + SLA colour, independent of polling
  function tick() {
    const now = serverNow();
    document.querySelectorAll('[data-since]').forEach(b => {
      const ms = now - tms(b.dataset.since);
      b.textContent = dur(ms);
      const card = b.closest('.req');
      if (!card) return;
      // SLA colour is always about how long the traveller waited before someone picked it up
      const wait = b.dataset.mode === 'open' ? ms : null;
      card.classList.toggle('amber', wait != null && wait >= SLA * 60000 && wait < SLA * 120000);
      card.classList.toggle('red', wait != null && wait >= SLA * 120000);
      if (card.classList.contains('fresh') && !(S.fresh[card.dataset.id] > Date.now())) card.classList.remove('fresh');
    });
    const o = document.querySelector('[data-oldest]');
    if (o) { const w = S.rows.filter(r => r.status === 'open').map(r => tms(r.ts)); if (w.length) o.textContent = dur(now - Math.min(...w)); }
    const d = new Date(now);
    $('#clock').textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }
  setInterval(tick, 1000);
  // gentle reminder chime every 2 minutes while someone has waited past the SLA
  setInterval(() => { if (S.rows.some(r => r.status === 'open' && serverNow() - tms(r.ts) > SLA * 60000)) chime(true); }, 120000);

  // ============================================================== actions
  const findRow = id => S.rows.find(r => r.id === id) || S.closed.find(r => r.id === id);
  async function update(id, body, msg) {
    if (S.busy) return; S.busy = true;
    try { await api('/api/requests/' + id, { method: 'PUT', body: JSON.stringify(body) }); if (msg) toast(msg); }
    catch (e) { if (e.message !== 'unauthorised') toast('Couldn’t update: ' + e.message, true); }
    S.busy = false;
    poll();
  }
  function needMe() {
    if (S.me) return false;
    const b = $('#meBox'); b.classList.add('need'); $('#me').focus();
    toast('Enter your name in “I am” first', true);
    setTimeout(() => b.classList.remove('need'), 2500);
    return true;
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = Number(b.dataset.id || b.closest('[data-id]')?.dataset.id), r = findRow(id), act = b.dataset.act;
    if (!r) return;
    const k = kindOf(r);
    if (act === 'take') { if (needMe()) return; update(id, { status: 'acknowledged', assigned_to: S.me }, `${k.icon} ${S.me} is on it`); }
    else if (act === 'done') update(id, { status: 'done', ...(r.assigned_to || !S.me ? {} : { assigned_to: S.me }) }, `✓ ${k.label} closed`);
    else if (act === 'cancel') { if (confirm(`Cancel this request?\n\n${k.icon} ${k.label} at ${placeOf(r)}${r.details ? '\n“' + r.details + '”' : ''}`)) update(id, { status: 'cancelled' }, 'Request cancelled'); }
    else if (act === 'reopen') update(id, { status: 'open', assigned_to: null }, 'Request reopened');
    else if (act === 'note') { S.editing[id] = true; render(); document.querySelector(`.req[data-id="${id}"] textarea`)?.focus(); }
    else if (act === 'note-x') { delete S.editing[id]; delete S.drafts[id]; render(); }
    else if (act === 'note-save') {
      const v = (S.drafts[id] ?? r.notes ?? '').trim();
      delete S.editing[id]; delete S.drafts[id];
      update(id, { notes: v || null }, 'Note saved');
    }
  });
  document.addEventListener('input', e => {
    if (e.target.matches('textarea[data-note]')) S.drafts[Number(e.target.closest('[data-id]').dataset.id)] = e.target.value;
  });

  // who am I (per device)
  S.me = (store.get('assist-me') || '').trim();
  $('#me').value = S.me;
  $('#me').addEventListener('change', () => { S.me = $('#me').value.trim(); store.set('assist-me', S.me || null); document.querySelectorAll('.req').forEach(c => c._html = null); render(); if (S.me) toast(`Signed in as ${S.me}`); });

  $('#closedBtn').addEventListener('click', () => { S.showClosed = !S.showClosed; store.set('assist-closed', S.showClosed ? '1' : null); renderClosed(); });

  // theme: OS preference by default; the toggle pins light/dark (shared with Insights)
  const THEME_KEY = 'aura-theme';
  const t0 = store.get(THEME_KEY); if (t0) document.documentElement.dataset.theme = t0;
  $('#theme').addEventListener('click', () => {
    const next = getComputedStyle(document.documentElement).colorScheme.includes('dark') ? 'light' : 'dark';
    document.documentElement.dataset.theme = next; store.set(THEME_KEY, next);
  });

  // keep a wall screen awake where supported
  async function wake() { try { if (navigator.wakeLock && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch (e) { /* not allowed */ } }
  document.addEventListener('visibilitychange', () => { wake(); if (document.visibilityState === 'visible') poll(); });

  // ============================================================== PIN gate
  function lock(msg) {
    clearTimeout(S.pollT);
    PIN = ''; sessionStorage.removeItem('pin');
    S.seen = null;
    $('#app').hidden = true; $('#gate').hidden = false;
    $('#pin').value = ''; $('#pinErr').textContent = msg || ''; $('#pin').focus();
    document.title = 'Aura Assist';
  }
  $('#lock').addEventListener('click', () => lock());
  $('#pinGo').addEventListener('click', () => {
    PIN = $('#pin').value.trim(); if (!PIN) return;
    sessionStorage.setItem('pin', PIN); $('#pinErr').textContent = '';
    unlockAudio();                       // the unlock tap doubles as the audio gesture
    poll();
  });
  $('#pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('#pinGo').click(); });

  // supervisor alerts rail (no-shows, understaffing, safety…): acknowledge / resolve here; routing and history live in Admin → Alerts
  async function pollSup() {
    if (!PIN || $('#app').hidden) return;
    try {
      const j = await api('/api/alerts?status=new,ack');
      const skew = tms(j.now) - Date.now(), types = (j.settings || {}).types || {}, sv = { high: 0, medium: 1, low: 2 };
      const rows = j.rows.sort((a, b) => (a.status === 'new' ? 0 : 1) - (b.status === 'new' ? 0 : 1) || sv[a.severity] - sv[b.severity] || b.id - a.id);
      const n = rows.filter(r => r.status === 'new').length;
      $('#sup').hidden = !rows.length;
      $('#supN').textContent = n; $('#supN').classList.toggle('zero', !n);
      $('#supSub').textContent = rows.length - n ? `· ${rows.length - n} acknowledged` : '';
      const rel = ts => { const m = Math.max(0, Math.round((Date.now() + skew - tms(ts)) / 60000)); return m < 1 ? 'now' : m < 60 ? `${m} min` : `${Math.round(m / 60)} h`; };
      $('#supList').innerHTML = rows.slice(0, 12).map(r => `<div class="si ${esc(r.severity)}${r.status === 'ack' ? ' ack' : ''}"><span aria-hidden="true">${esc((types[r.type] || {}).icon || '🔔')}</span><span>${esc(r.text)}${r.ack_by && r.status !== 'new' ? ` <span class="muted">· ✋ ${esc(r.ack_by)}</span>` : ''}</span><small>${esc(rel(r.ts))}</small><span class="sa">${r.status === 'new' ? `<button class="btn" data-sup="ack" data-aid="${r.id}">Acknowledge</button>` : ''}<button class="btn ${r.status === 'new' ? 'ghost' : 'go'}" data-sup="resolved" data-aid="${r.id}">Resolve</button></span></div>`).join('');
    } catch (e) { /* the rail is optional */ }
  }
  $('#supList').addEventListener('click', async e => {
    const b = e.target.closest('[data-sup]'); if (!b) return;
    if (needMe()) return;
    b.disabled = true;
    try {
      await api('/api/alerts/' + b.dataset.aid, { method: 'PUT', body: JSON.stringify({ status: b.dataset.sup, by: S.me }) });
      toast(b.dataset.sup === 'ack' ? `✋ Acknowledged by ${S.me}` : '✓ Alert resolved');
    } catch (err) { if (err.message !== 'unauthorised') toast('Couldn’t update: ' + err.message, true); }
    pollSup();
  });
  try { if (store.get('assist-sup') === '1') $('#sup').open = true; } catch (e) { /* ignore */ }
  $('#sup').addEventListener('toggle', () => store.set('assist-sup', $('#sup').open ? '1' : null));
  setInterval(pollSup, 30000);
  setTimeout(pollSup, 1500);

  soundUI(); notifyUI(); wake();
  if (PIN) poll(); else lock();
})();
</script>
</body>
</html>
