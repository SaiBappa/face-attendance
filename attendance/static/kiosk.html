<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#031a2b">
<title>Aura</title>
<style>
  /* ------------------------------------------------------------------ theme */
  :root {
    --bg1:#031a2b; --bg2:#06384d; --a1:#2ee6d6; --a2:#3aa0ff; --a3:#7cf5c8;
    --fg:#f4fbff; --muted:rgba(230,245,255,.62); --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
    --in:#22c55e; --break:#f59e0b; --back:#3b82f6; --out:#ef4444;
    --orb:var(--a1);
  }
  body[data-theme=sunset] { --bg1:#1a0b1e; --bg2:#44142f; --a1:#ff8a5b; --a2:#ffd166; --a3:#ff5d8f; }
  body[data-theme=aurora] { --bg1:#07071a; --bg2:#1a1147; --a1:#8b5cf6; --a2:#22d3ee; --a3:#34d399; }
  body[data-theme=mono]   { --bg1:#09090b; --bg2:#1c1c21; --a1:#e5e7eb; --a2:#9ca3af; --a3:#f5f5f4; }
  body[data-state=listening] { --orb:#ff5d8f; }
  body[data-state=thinking]  { --orb:#a78bfa; }
  body[data-state=staff]     { --orb:#34d399; }
  body[data-state=visitor]   { --orb:var(--a2); }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg1); color:var(--fg);
    font-family:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  body { user-select:none; -webkit-user-select:none; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .hidden { display:none !important; }

  /* ------------------------------------------------------------------ backdrop */
  #bg { position:fixed; inset:0; background:radial-gradient(120% 90% at 20% 0%, var(--bg2), var(--bg1) 60%); overflow:hidden; }
  .blob { position:absolute; width:70vmax; height:70vmax; border-radius:50%; filter:blur(90px); opacity:.35; mix-blend-mode:screen; }
  .blob.b1 { background:var(--a1); top:-30vmax; left:-20vmax; animation:drift1 28s ease-in-out infinite alternate; }
  .blob.b2 { background:var(--a2); bottom:-35vmax; right:-25vmax; animation:drift2 34s ease-in-out infinite alternate; }
  .blob.b3 { background:var(--a3); top:30%; left:40%; width:40vmax; height:40vmax; opacity:.18; animation:drift3 22s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform:translate(18vmax,12vmax) scale(1.15); } }
  @keyframes drift2 { to { transform:translate(-14vmax,-10vmax) scale(.9); } }
  @keyframes drift3 { to { transform:translate(-20vmax,8vmax) scale(1.3); } }
  #slides { position:absolute; inset:0; }
  .slide { position:absolute; inset:0; opacity:0; transition:opacity 1.6s ease; }
  .slide.on { opacity:1; }
  .slide img, .slide video { width:100%; height:100%; object-fit:cover; }
  .slide.on img { animation:kenburns 14s ease-out forwards; }
  @keyframes kenburns { from { transform:scale(1.02) translate(0,0); } to { transform:scale(1.14) translate(-2%,-1.5%); } }
  #veil { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.05) 35%, rgba(0,0,0,.35) 65%, rgba(0,0,0,.8) 100%); transition:background .6s; }
  body:not([data-state=ambient]) #veil { background:rgba(4,10,18,.78); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
  #caption { position:absolute; left:calc(28px + env(safe-area-inset-left)); bottom:150px; font-size:15px; color:var(--muted); letter-spacing:.02em; max-width:60vw; }
  body:not([data-state=ambient]) #caption { opacity:0; }

  /* ------------------------------------------------------------------ layout */
  #stage { position:fixed; inset:0; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto auto; padding:calc(18px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left)); }
  header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .where { min-width:0; } .when { flex:none; }
  .where .zone { display:inline-flex; align-items:center; gap:8px; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--a1); font-weight:600; }
  .where .zone i { width:8px; height:8px; border-radius:50%; background:var(--a1); box-shadow:0 0 12px var(--a1); animation:pulse 2.4s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .where h1 { margin:6px 0 2px; font-size:clamp(24px,3.6vw,40px); font-weight:700; letter-spacing:-.02em; }
  .where p { margin:0; color:var(--muted); font-size:16px; }
  .when { text-align:right; }
  #clock { font-size:clamp(34px,min(6.5vw,10vh),76px); font-weight:200; letter-spacing:-.04em; font-variant-numeric:tabular-nums; line-height:1; }
  #date { color:var(--muted); font-size:15px; margin-top:6px; }
  .privacy { margin-top:10px; display:inline-flex; gap:6px; align-items:center; font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:5px 10px; background:var(--glass); }

  /* ------------------------------------------------------------------ orb + portal */
  #center { display:flex; flex-direction:column; align-items:center; gap:clamp(10px,2.2vh,26px); min-height:0; text-align:center; overflow-y:auto; overflow-x:hidden; padding:clamp(8px,2.4vh,36px) 0 8px; container-type:size; }
  /* flexible spacers centre the content but collapse to 0 when it's taller than the screen, so it scrolls from the top instead of being clipped */
  #center::before, #center::after { content:""; flex:1 0 0; }
  #center::before { margin-bottom:calc(clamp(10px,2.2vh,26px) * -1); } #center::after { margin-top:calc(clamp(10px,2.2vh,26px) * -1); }   /* cancel the gap next to each spacer */
  #who, #act { display:contents; }
  #orbWrap { position:relative; width:min(38vmin,300px,50cqh); aspect-ratio:1; transition:width .6s cubic-bezier(.2,.8,.2,1); flex:none; }
  body[data-state=ambient] #orbWrap { width:min(34vmin,340px,52cqh); }   /* ripple rings reach ~1.6x the orb */
  body[data-state=ambient] #center { overflow:hidden; }   /* nothing to scroll while idle; stops the fading ripple rings creating a scrollbar */
  body[data-state=ambient] #headline:empty, body[data-state=ambient] #sub:empty { display:none; }
  body[data-state=staff] #orbWrap, body[data-state=visitor] #orbWrap { width:min(24vmin,17vh,190px,26cqh); }
  body.chatting #orbWrap { width:min(16vmin,120px,26cqh); }
  .orb { position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), transparent 32%), radial-gradient(circle at 50% 50%, var(--orb), transparent 72%);
    filter:saturate(1.2); animation:breathe 5s ease-in-out infinite; transition:background .6s; }
  .orb::before { content:""; position:absolute; inset:8%; border-radius:50%; background:conic-gradient(from 0deg, var(--a1), var(--a2), var(--a3), var(--a1));
    filter:blur(18px); opacity:.75; mix-blend-mode:screen; animation:spin 9s linear infinite; }
  body[data-state=listening] .orb::before, body[data-state=thinking] .orb::before { animation-duration:2.4s; }
  .orb::after { content:""; position:absolute; inset:-14%; border-radius:50%; background:radial-gradient(circle, var(--orb), transparent 62%); opacity:.35; filter:blur(22px); z-index:-1; }
  @keyframes breathe { 50% { transform:scale(1.06); } }
  body[data-state=listening] .orb { animation:breathe .9s ease-in-out infinite; }
  body[data-state=thinking] .orb { animation:breathe 1.6s ease-in-out infinite; }
  .ring { position:absolute; inset:-6%; border-radius:50%; background:conic-gradient(from 0deg, transparent 0 62%, var(--orb) 80%, #fff 86%, transparent 90%);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
    animation:spin 2.2s linear infinite; opacity:0; transition:opacity .4s; }
  body[data-state=presence] .ring, body[data-state=thinking] .ring { opacity:1; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .ring2 { position:absolute; inset:-14%; border-radius:50%; border:1px solid var(--line); animation:ripple 4s ease-out infinite; }
  .ring2.r2 { animation-delay:2s; }
  @keyframes ripple { from { transform:scale(.85); opacity:.8; } to { transform:scale(1.25); opacity:0; } }
  #portal { position:absolute; inset:7%; border-radius:50%; overflow:hidden; opacity:0; transition:opacity .5s; box-shadow:inset 0 0 40px rgba(0,0,0,.6); }
  body[data-state=presence] #portal, body[data-state=staff] #portal, body[data-state=visitor] #portal { opacity:1; }
  body.chatting #portal { opacity:.0; }
  #portal video { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #scanline { position:absolute; left:0; right:0; height:30%; background:linear-gradient(180deg, transparent, rgba(255,255,255,.25), transparent); animation:scan 1.8s ease-in-out infinite; opacity:0; }
  body[data-state=presence] #scanline { opacity:1; }
  @keyframes scan { from { top:-30%; } to { top:100%; } }

  /* ------------------------------------------------------------------ human activity indicator */
  #activity { display:none; align-items:center; gap:10px; margin:0 auto clamp(6px,1.2vh,12px); padding:8px 16px 8px 12px; border-radius:999px; width:max-content; max-width:100%;
    background:var(--glass); border:1px solid color-mix(in srgb, var(--a1) 55%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    box-shadow:0 0 0 1px rgba(0,0,0,.15), 0 8px 30px -10px var(--a1); color:var(--fg); font-size:clamp(12px,1.8vh,15px); font-weight:600; letter-spacing:.12em; text-transform:uppercase; }
  body.activity[data-state=ambient] #activity, body[data-state=presence] #activity { display:inline-flex; animation:rise .4s forwards; opacity:0; }
  #activity .bars { display:inline-flex; align-items:flex-end; gap:3px; height:14px; }
  #activity .bars i { width:3px; height:100%; border-radius:2px; background:var(--a1); box-shadow:0 0 8px var(--a1); animation:eq 1s ease-in-out infinite; transform-origin:bottom; }
  #activity .bars i:nth-child(2) { animation-delay:.15s; } #activity .bars i:nth-child(3) { animation-delay:.3s; } #activity .bars i:nth-child(4) { animation-delay:.45s; }
  @keyframes eq { 0%,100% { transform:scaleY(.3); } 50% { transform:scaleY(1); } }
  /* someone is moving in front of the idle screen: the orb wakes a little before a face is found */
  body.activity[data-state=ambient] .ring { opacity:.55; }
  body.activity[data-state=ambient] .ring2 { animation-duration:2s; border-color:color-mix(in srgb, var(--a1) 45%, transparent); }
  body.activity[data-state=ambient] #hint { opacity:0; }
  #hint { transition:opacity .4s; }
  @media (prefers-reduced-motion: reduce) { #activity .bars i, #activity { animation:none !important; opacity:1; } }

  /* ------------------------------------------------------------------ text */
  #say { max-width:min(900px,100%); }
  #headline { font-size:clamp(26px,min(5.4vw,8vh),64px); font-weight:750; letter-spacing:-.03em; line-height:1.12; margin:0; padding-bottom:.06em;
    background:linear-gradient(92deg, #fff 10%, var(--a1) 55%, var(--a2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #sub { margin-top:clamp(4px,1vh,10px); color:var(--muted); font-size:clamp(15px,min(2.2vw,3vh),24px); min-height:1.3em; }
  #lines { margin:clamp(6px,1.4vh,14px) auto 0; display:grid; gap:8px; max-width:760px; }
  #lines div { font-size:clamp(15px,min(2.2vw,2.9vh),23px); line-height:1.35; opacity:0; transform:translateY(8px); animation:rise .6s forwards; }
  @keyframes rise { to { opacity:1; transform:none; } }
  #chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:clamp(8px,1.4vh,14px); }
  .chip { display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:999px; background:var(--glass); border:1px solid var(--line); font-size:clamp(13px,2vh,16px); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); opacity:0; animation:rise .5s forwards; }
  .chip .sw { width:14px; height:14px; border-radius:50%; border:1px solid rgba(255,255,255,.5); }
  .shimmer { height:18px; border-radius:9px; margin:6px auto; background:linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,.16), rgba(255,255,255,.06)); background-size:200% 100%; animation:sh 1.2s linear infinite; }
  @keyframes sh { to { background-position:-200% 0; } }

  /* ------------------------------------------------------------------ actions */
  #actions { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:clamp(10px,1.8vh,16px); width:min(1100px,100%); }
  #actions button { position:relative; border:1px solid var(--line); border-radius:24px; padding:clamp(14px,2.6vh,34px) 8px clamp(12px,2.2vh,30px); background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    display:flex; flex-direction:column; align-items:center; gap:6px; font-size:clamp(18px,min(3.2vw,2.8vh),34px); font-weight:700; letter-spacing:.02em; transition:transform .15s, box-shadow .3s, background .3s; }
  #actions button small { font-size:13px; font-weight:500; color:var(--muted); letter-spacing:0; }
  #actions button .ic { width:46px; height:46px; border-radius:15px; display:grid; place-items:center; font-size:22px; }
  #actions button:active { transform:scale(.95); }
  #actions button.suggest { background:rgba(255,255,255,.14); box-shadow:0 0 0 2px var(--c), 0 10px 40px -8px var(--c); }
  #actions button.suggest::after { content:"Suggested"; position:absolute; top:-10px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; background:var(--c); color:#fff; border-radius:999px; padding:3px 9px; }
  .a-IN { --c:var(--in); } .a-BREAK { --c:var(--break); } .a-BACK { --c:var(--back); } .a-OUT { --c:var(--out); }
  #actions .ic { background:var(--c); }

  #tools { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; align-items:center; }
  .pill { display:inline-flex; align-items:center; gap:9px; border:1px solid var(--line); background:var(--glass); border-radius:999px; padding:13px 20px; font-size:17px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  .pill.primary { background:linear-gradient(135deg, var(--a1), var(--a2)); color:#04121c; border:0; font-weight:700; box-shadow:0 10px 30px -10px var(--a1); }
  .pill.ghost { background:transparent; color:var(--muted); }
  .pill:active { transform:scale(.96); }
  #prompts { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:900px; }
  #prompts button { border:1px solid var(--line); background:var(--glass); border-radius:16px; padding:11px 16px; font-size:16px; }
  #countdown { height:3px; width:min(420px,70vw); background:var(--line); border-radius:2px; overflow:hidden; }
  #countdown i { display:block; height:100%; width:100%; background:var(--orb); transform-origin:left; }

  /* ------------------------------------------------------------------ ambient bottom */
  #ambient { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:end; margin-bottom:10px; transition:opacity .5s; }
  /* collapse (not just fade) once someone is in front: the flight board is tall and would squeeze #center, pushing the IN/OUT actions out of view */
  body:not([data-state=ambient]) #ambient { display:none; }
  #infoCard { max-width:520px; padding:clamp(12px,2vh,18px) clamp(14px,1.6vw,20px); border-radius:22px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); display:flex; gap:14px; align-items:flex-start; min-height:84px; }
  #infoCard .ico { font-size:30px; line-height:1; }
  #infoCard b { display:block; font-size:18px; margin-bottom:4px; }
  #infoCard span { color:var(--muted); font-size:15px; line-height:1.4; }
  #infoCard.swap { animation:swap .7s; }
  @keyframes swap { 0% { opacity:0; transform:translateY(10px); } 100% { opacity:1; transform:none; } }
  #pulse { display:flex; gap:10px; justify-content:flex-end; }
  #right { display:flex; flex-direction:column; gap:12px; align-items:flex-end; }
  /* flight board */
  #board { width:min(620px,46vw); border-radius:22px; background:rgba(0,0,0,.28); border:1px solid var(--line); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); padding:12px 14px 8px; }
  #board .bh { display:flex; justify-content:space-between; align-items:center; font-size:clamp(11px,1.6vh,15px); letter-spacing:.12em; text-transform:uppercase; color:var(--a1); font-weight:700; margin:0 4px 6px; }
  #board .bh span { color:var(--muted); letter-spacing:.04em; font-weight:500; text-transform:none; }
  #board table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  #board td { padding:clamp(3px,.9vh,9px) 4px; font-size:clamp(13px,min(1.3vw,2.2vh),20px); border-top:1px solid rgba(255,255,255,.07); white-space:nowrap; }
  #board table { table-layout:fixed; }
  #board col.c-t { width:21%; } #board col.c-n { width:17%; } #board col.c-w { width:14%; } #board col.c-s { width:22%; }
  @media (max-width: 520px) { #board col.c-w { width:0; } #board col.c-t { width:24%; } #board col.c-s { width:26%; } #board td { font-size:13px; } }
  #board td { overflow:hidden; text-overflow:ellipsis; }
  #board td.t s { color:var(--muted); font-size:13px; margin-right:4px; }
  #board tr.swap td { animation:rise .5s both; }
  .fst { display:inline-block; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:.03em; background:rgba(255,255,255,.1); }
  .fst.boarding { background:#16a34a; color:#fff; animation:pulse 1.6s infinite; } .fst.delayed { background:#f59e0b; color:#1a1200; }
  .fst.cancelled, .fst.gate_closed, .fst.diverted { background:#ef4444; color:#fff; } .fst.checkin, .fst.approaching { background:rgba(46,230,214,.25); color:#bff9f3; }
  .fst.departed, .fst.landed { opacity:.6; }
  /* chat extras: flight card, help grid, ticket */
  .fcard { margin-top:10px; padding:10px 12px; border-radius:14px; background:rgba(0,0,0,.25); display:grid; grid-template-columns:auto 1fr auto; gap:4px 12px; align-items:center; font-size:15px; }
  .fcard b { font-size:20px; } .fcard .big { font-size:26px; font-weight:750; font-variant-numeric:tabular-nums; }
  .helpbtn { margin-top:10px; display:inline-flex; gap:8px; align-items:center; border:0; border-radius:14px; padding:12px 16px; font-weight:700; font-size:16px; background:linear-gradient(135deg,#ff8a5b,#ff5d8f); color:#fff; }
  .helpgrid { margin-top:10px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .helpgrid button { border:1px solid var(--line); background:rgba(255,255,255,.08); border-radius:14px; padding:14px 10px; font-size:15px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .helpgrid button i { font-style:normal; font-size:28px; }
  .ticket { align-self:stretch; max-width:none; border-radius:18px; padding:14px 16px; background:linear-gradient(135deg, rgba(255,138,91,.22), rgba(255,93,143,.18)); border:1px solid rgba(255,138,91,.5); display:flex; gap:14px; align-items:center; }
  .ticket .ti { font-size:34px; } .ticket b { display:block; font-size:18px; } .ticket small { color:var(--muted); }
  .ticket.ack { background:linear-gradient(135deg, rgba(34,197,94,.25), rgba(46,230,214,.18)); border-color:rgba(34,197,94,.6); }
  .ticket button { margin-left:auto; }
  #pulse div { padding:clamp(8px,1.4vh,14px) clamp(10px,1.2vw,18px); border-radius:18px; background:var(--glass); border:1px solid var(--line); text-align:center; min-width:96px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
  #pulse b { display:block; font-size:clamp(18px,3vh,30px); font-weight:650; font-variant-numeric:tabular-nums; }
  #pulse span { font-size:12px; color:var(--muted); letter-spacing:.04em; }
  #hint { color:var(--muted); font-size:clamp(16px,2vw,20px); letter-spacing:.01em; }
  #hint b { color:var(--fg); }

  #ticker { height:clamp(32px,4.4vh,44px); overflow:hidden; border-top:1px solid var(--line); display:flex; align-items:center; mask-image:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); -webkit-mask-image:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
  #ticker .track { display:inline-flex; gap:60px; white-space:nowrap; animation:tick 40s linear infinite; padding-left:100%; font-size:15px; color:var(--muted); }
  #ticker .alert { color:#fecaca; font-weight:600; }
  @keyframes tick { to { transform:translateX(-100%); } }

  /* ------------------------------------------------------------------ chat */
  #chat { position:fixed; left:50%; bottom:0; transform:translate(-50%, 105%); width:min(820px,100vw); height:min(62vh,640px); background:rgba(8,16,28,.82);
    border:1px solid var(--line); border-bottom:0; border-radius:28px 28px 0 0; backdrop-filter:blur(26px); -webkit-backdrop-filter:blur(26px);
    display:flex; flex-direction:column; transition:transform .45s cubic-bezier(.2,.8,.2,1); z-index:20; padding-bottom:env(safe-area-inset-bottom); }
  body.chatting #chat { transform:translate(-50%,0); }
  body.chatting #say, body.chatting #tools, body.chatting #prompts, body.chatting #actions, body.chatting #countdown { opacity:0; pointer-events:none; }
  #chat header { padding:16px 20px 10px; align-items:center; }
  #chat header b { font-size:18px; }
  #chat header .who { color:var(--muted); font-size:14px; }
  #msgs { flex:1; overflow-y:auto; padding:6px 18px 12px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; user-select:text; -webkit-user-select:text; }

  /* ------------------------------------------------------------------ overlays */

  /* safety check sheet */

  .risk b.low { color:#4ade80; } .risk b.moderate { color:#fbbf24; } .risk b.high { color:#f87171; }

  /* expired security pass: full-screen red lockout, swallows every tap */

  /* ------------------------------------------------------------------ portrait / small */
  @media (max-aspect-ratio: 4/5) {

  @media (min-aspect-ratio: 1/1) {

  /* short landscape screens (e.g. a laptop or TV in a browser window): keep greeting + actions + tools on one screen */
  @media (max-height: 760px) and (min-aspect-ratio: 4/5) {
    #clock { font-size:clamp(34px,8vh,60px); } #date { font-size:13px; margin-top:2px; } .when .privacy { display:none; }
    .where h1 { font-size:clamp(22px,5vh,34px); margin:2px 0 0; } .where p { font-size:14px; }
    body[data-state=staff] #orbWrap, body[data-state=visitor] #orbWrap { width:min(17vh,160px,26cqh); }
    /* the tap targets come straight after the name; the longer AI greeting (lines, chips) flows underneath */
    #say { display:contents; }

    #actions { order:4; } #tools { order:5; } #countdown { order:6; } #lines { order:7; margin:0 auto; max-width:min(760px,92vw); } #chips { order:8; margin-top:0; } #prompts { order:9; }
    #lines:empty, #chips:empty { display:none; }
    #actions button { padding:10px 8px 8px; gap:2px; border-radius:18px; font-size:clamp(16px,2.8vh,20px); }

  }
  /* landscape with the IN/BREAK/BACK/OUT buttons up: person on the left, big 2x2 tap targets on the right, everything on one screen */
  @media (min-aspect-ratio: 1/1) {
    body.acting:not(.chatting) #center { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:center;
      gap:clamp(20px,4vw,72px); padding:clamp(8px,2vh,28px) clamp(0px,2vw,40px); overflow:hidden; }

    body.acting:not(.chatting) #say { display:block; max-width:100%; }
    body.acting:not(.chatting) #orbWrap { width:min(26vh,300px,32cqh); order:0; }
    body.acting:not(.chatting) #headline { font-size:clamp(26px,min(4.6vw,8.5vh),104px); max-width:none; }
    body.acting:not(.chatting) #sub { font-size:clamp(15px,min(2vw,3.2vh),34px); }
    body.acting:not(.chatting) #lines div { font-size:clamp(15px,min(2vw,3vh),32px); }
    body.acting:not(.chatting) .chip { font-size:clamp(13px,2.1vh,22px); padding:.5em 1em; }
    body.acting:not(.chatting) #sub { margin-top:clamp(4px,1vh,10px); }
    body.acting:not(.chatting) #lines { max-width:none; }
    body.acting:not(.chatting) #actions { grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:1fr; width:100%; flex:0 1 auto; height:min(100%,74vh); min-height:0; gap:clamp(10px,1.8vh,18px); }
    body.acting:not(.chatting) #actions button { justify-content:center; padding:clamp(10px,2vh,24px) 10px; gap:clamp(4px,1vh,10px); border-radius:clamp(18px,3vh,28px);
      font-size:clamp(20px,min(3.2vw,5.4vh),60px); min-height:0; }
    body.acting:not(.chatting) #actions button .ic { width:clamp(36px,9.5vh,112px); height:clamp(36px,9.5vh,112px); border-radius:clamp(11px,2.8vh,32px); font-size:clamp(18px,4.4vh,52px); }

    body.acting:not(.chatting) #tools, body.acting:not(.chatting) #countdown { flex:none; }
    body.acting:not(.chatting) .pill { padding:clamp(8px,1.6vh,14px) clamp(16px,2vw,24px); font-size:clamp(15px,2.4vh,26px); }
  }
  @media (max-width: 820px) {
    #clock { font-size:44px; }
    #board td { font-size:14px; padding:6px 3px; }
  }

<body data-state="ambient" data-theme="lagoon">

      <button class="a-BREAK" data-a="BREAK"><span class="ic">☕︎</span>BREAK<small>Take a break</small></button>
      <button class="a-BACK" data-a="BACK"><span class="ic">↩︎</span>BACK<small>From break</small></button>

<div id="status"></div>
<canvas id="cv" hidden></canvas>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const KIOSK = q.get('kiosk') || 'Main';
  const SCAN_IDLE_MS = 900;       // frame cadence while the scene is still
  const SCAN_ACTIVE_MS = 120;     // movement in front of the kiosk
  const SCAN_FACE_MS = 40;        // a face is in view but not matched yet: scan almost back-to-back
  const SCAN_VISITOR_MS = 650;    // visitor panel / chat is up: only watching for them leaving
  const VISITOR_MIN_MS = 400;     // ...and 3 unmatched frames spanning at least this long before "visitor"
  const FRAME_W = 480;            // downscale before upload (a kiosk face is large; 480 px is plenty)
  const JPEG_QUALITY = 0.75;
  const DEBUG = q.has('debug');   // ?debug=1: on-screen latency overlay
  const RECOGNIZE_TIMEOUT_MS = 8000; // give up on a frame that hangs (e.g. server restarting)
  const STAFF_TIMEOUT_S = 20;     // staff panel returns to ambient if untouched
  const VISITOR_TIMEOUT_S = 25;
  const COOLDOWN_MS = 8000;       // after an action, ignore the same person (backstop if they never leave the frame)
  const COOLDOWN_CLEAR_FRAMES = 2; // ...but end the cooldown once this many frames in a row have no face
  const MOTION_MS = 250;          // on-device motion check cadence (tiny thumbnail, never uploaded)
  const MOTION_HOLD_MS = 2500;    // keep the activity sign up this long after movement stops
  const MOODS = { happiness:['😊','happy'], neutral:['😌','calm'], surprise:['😮','surprised'], sadness:['😔','low'],
                  anger:['😠','tense'], fear:['😟','anxious'], disgust:['😣','uneasy'], contempt:['😏','unimpressed'] };
  const WELCOME = ['Welcome', 'مرحباً', 'މަރުޙަބާ', '欢迎', 'Добро пожаловать', 'स्वागत है', 'Benvenuti', 'Willkommen', 'Bienvenue', 'ようこそ', 'Bienvenidos', '환영합니다'];

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
  const video = $('video'), cv = $('cv');

  const S = {
    state: 'ambient', encounter: null, noFace: 0, unmatched: 0, face: null, current: null, cfg: null,
    paused: false, chatting: false, lastActivity: Date.now(), cooldownName: null, cooldownUntil: 0,
    deadline: 0, mediaIdx: 0, cardIdx: 0, lang: 'en', voiceOn: true, busy: false, failures: 0,
    frames: 0, firstUnmatchedAt: 0,
  };
  let approachAt = 0;   // when the current walk-up started (first motion, else first frame of the encounter)

  // ================================================================ ?debug=1 latency overlay
  // Per frame: capture (canvas + JPEG on this device), network (round trip minus server time),
  // server stages from the Server-Timing header, and the time from walk-up to "Hi, name".
  const dbg = (() => {
    if (!DEBUG) return { frame() {}, walkup() {} };
    const el = document.createElement('pre');
    el.id = 'latency';
    el.setAttribute('aria-hidden', 'true');
    el.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:9999;margin:0;padding:10px 12px;max-width:calc(100vw - 20px);' +
      'font:12px/1.45 ui-monospace,Menlo,monospace;color:#e6f4f1;background:rgba(4,14,20,.82);border:1px solid rgba(255,255,255,.18);' +
      'border-radius:10px;pointer-events:none;white-space:pre-wrap;';
    document.body.appendChild(el);
    const hist = [];          // last 30 frames
    let last = null, walk = null;
    const parse = h => Object.fromEntries((h || '').split(',').map(p => {
      const [name, ...kv] = p.trim().split(';');
      const d = kv.find(x => x.startsWith('dur='));
      return [name, d ? parseFloat(d.slice(4)) : NaN];
    }).filter(([n]) => n));
    const p50 = k => { const v = hist.map(f => f[k]).filter(Number.isFinite).sort((a, b) => a - b); return v.length ? v[v.length >> 1] : NaN; };
    const ms = v => Number.isFinite(v) ? String(Math.round(v)).padStart(4) : '   –';
    function render() {
      const fps = hist.length > 1 ? (hist.length - 1) / ((hist[hist.length - 1].at - hist[0].at) / 1000) : 0;
      const s = last?.srv || {};
      el.textContent =
        `LATENCY ms        capture  network  server   total\n` +
        `last frame           ${ms(last?.capture)}     ${ms(last?.net)}    ${ms(last?.server)}    ${ms(last?.total)}\n` +
        `median (${String(hist.length).padStart(2)} frames)   ${ms(p50('capture'))}     ${ms(p50('net'))}    ${ms(p50('server'))}    ${ms(p50('total'))}\n` +
        `server detail   decode ${ms(s.decode)}  detect ${ms(s.detect)}  embed ${ms(s.embed)}  mood+clothes ${ms(s.extras)}\n` +
        `frame ${last ? Math.round(last.bytes / 1024) : '–'} KB · ${fps.toFixed(1)} fps · next scan ${nextScanMs()} ms · state ${S.state}\n` +
        (walk ? `walk-up → ${walk.label}: ${(walk.ms / 1000).toFixed(2)} s over ${walk.frames} frame${walk.frames === 1 ? '' : 's'}` : 'walk-up → waiting for someone to step up');
    }
    el.textContent = 'LATENCY  waiting for the first frame…';
    return {
      frame({ capture, rtt, bytes, timing }) {
        const srv = parse(timing), server = srv.total;
        last = { at: performance.now(), capture, bytes, srv, server,
                 net: Number.isFinite(server) ? Math.max(0, rtt - server) : rtt, total: capture + rtt };
        hist.push(last); if (hist.length > 30) hist.shift();
        render();
      },
      walkup(label) {
        if (approachAt) walk = { label, ms: Date.now() - approachAt, frames: S.frames };
        render();
      },
    };
  })();

  function setState(s) { S.state = s; document.body.dataset.state = s; }
  function touch() { S.lastActivity = Date.now(); }
  function status(msg) { $('status').textContent = msg || ''; }

  // ================================================================ clock
  function tick() {
    const d = new Date();
    $('clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    $('date').textContent = d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
  }
  tick(); setInterval(tick, 1000);

  // ================================================================ sound + voice
  let actx;
  function beep(freq = 880, ms = 110, type = 'sine', vol = .18) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + ms / 1000);
      o.start(); o.stop(actx.currentTime + ms / 1000);
    } catch (_) {}
  }
  const chime = () => { beep(784, 120); setTimeout(() => beep(1175, 160), 110); };

  let voices = [];
  const loadVoices = () => { voices = (window.speechSynthesis && speechSynthesis.getVoices()) || []; };
  if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  function speak(text, locale = 'en-GB') {
    if (!S.voiceOn || !window.speechSynthesis || !text) return;
    const lang = locale.slice(0, 2);
    const voice = voices.find(v => v.lang === locale) || voices.find(v => v.lang.toLowerCase().startsWith(lang));
    if (!voice && lang !== 'en') return;            // no voice for this language (e.g. Dhivehi): text only
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, ''));
    u.lang = voice ? voice.lang : locale; if (voice) u.voice = voice; u.rate = 1.02; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }

  // ================================================================ kiosk config (location content)
  async function loadConfig() {
    try {
      const j = await fetch('/api/kiosk/' + encodeURIComponent(KIOSK)).then(r => r.json());
      S.cfg = j; status('');
      const k = j.kiosk;
      document.body.dataset.theme = k.theme || 'lagoon';
      S.voiceOn = !!k.voice;
      $('zone').textContent = k.zone || KIOSK;

      renderSlides(j.media || []);
      renderTicker(j.announcements || []);
      renderPulse(j.pulse || {});
      renderPrompts();
      if (S.state === 'ambient') { ambientText(); if ($('infoCard').classList.contains('hidden')) rotateCard(); }
    } catch (e) { status('Server unreachable — retrying'); }
  }

  let slideTimer;
  function renderSlides(media) {
    const box = $('slides');

    box.dataset.key = key; box.innerHTML = '';
    media.forEach((m, i) => {
      const d = document.createElement('div'); d.className = 'slide' + (i === 0 ? ' on' : '');
      d.innerHTML = (m.mime || '').startsWith('video') ? `<video src="${esc(m.url)}" muted playsinline loop autoplay></video>` : `<img src="${esc(m.url)}" alt="">`;
      d.dataset.caption = m.caption || '';
      box.appendChild(d);
    });
    $('caption').textContent = media[0]?.caption || '';
    clearInterval(slideTimer);
    if (media.length > 1) slideTimer = setInterval(() => {
      const all = box.querySelectorAll('.slide'); if (!all.length) return;
      all[S.mediaIdx % all.length].classList.remove('on');

      const img = next.querySelector('img'); if (img) { img.style.animation = 'none'; img.offsetHeight; img.style.animation = ''; }

    }, 10000);
  }

  function renderTicker(ann) {
    const items = ann.map(a => `<span class="${a.level === 'alert' ? 'alert' : ''}">${a.level === 'alert' ? '⚠︎ ' : '◆ '}${esc(a.text)}</span>`);
    if (S.cfg?.wifi) items.push(`<span>📶 Free Wi-Fi: ${esc(S.cfg.wifi)}</span>`);
    items.push(`<span>💬 Talk to me in any language — I'll answer in yours</span>`);

  }

  function renderPulse(p) {
    const score = v => v == null ? '—' : Math.round((v + 1) * 50);
    const face = v => v == null ? '🙂' : v > .35 ? '😊' : v > 0 ? '🙂' : v > -.3 ? '😐' : '😔';
    $('pulse').innerHTML =
      `<div><b>${p.on_duty ?? 0}</b><span>ON DUTY</span></div>` +
      `<div><b>${face(p.mood_today)} ${score(p.mood_today)}</b><span>MOOD TODAY</span></div>` +
      `<div><b>${p.chats_today ?? 0}</b><span>CHATS TODAY</span></div>`;
  }

  function rotateCard() {
    const cards = S.cfg?.kiosk?.info || [];
    const el = $('infoCard');
    if (!cards.length) { el.classList.add('hidden'); return; }
    const c = cards[S.cardIdx++ % cards.length];
    el.classList.remove('hidden', 'swap'); el.offsetHeight; el.classList.add('swap');
    el.querySelector('.ico').textContent = c.icon || 'ℹ︎';
    el.querySelector('b').textContent = c.title || '';
    el.querySelector('span').textContent = c.text || '';
  }
  setInterval(() => { if (S.state === 'ambient') rotateCard(); }, 8000);

  function renderPrompts() {
    const cards = (S.cfg?.kiosk?.info || []).slice(0, 4);
    const items = cards.map(c => [`${c.icon || ''} ${c.title}`, `Where is the ${c.title}?`]);
    if (S.cfg?.features?.flights) items.unshift(['✈️ My flight', 'Check my flight']);
    items.push(['📶 Wi-Fi', 'What is the Wi-Fi?'], ['😄 Tell me a joke', 'Tell me a joke']);
    $('prompts').innerHTML = `<button data-help="1" style="background:linear-gradient(135deg,#ff8a5b,#ff5d8f);border:0;color:#fff;font-weight:700">🙋 Get help</button>` +
      items.map(([label, qtext]) => `<button data-q="${esc(qtext)}">${esc(label)}</button>`).join('');
    $('prompts').querySelectorAll('button[data-q]').forEach(b => b.onclick = () => { openChat(); send(b.dataset.q); });
    $('prompts').querySelector('[data-help]').onclick = () => { openChat(); showHelp(); };
  }

  // ================================================================ flight board
  const FST = { scheduled: 'On time', expected: 'On time', checkin: 'Check-in', boarding: 'Boarding', gate_closed: 'Gate closed',
                departed: 'Departed', delayed: 'Delayed', cancelled: 'Cancelled', approaching: 'Landing', landed: 'Landed', diverted: 'Diverted' };
  const hm = iso => (iso || '').slice(11, 16);
  let boardData = null, boardSide = 'dep';
  async function loadBoard() {
    try { boardData = await fetch('/api/flights?kiosk=' + encodeURIComponent(KIOSK) + '&limit=6').then(r => r.json()); renderBoard(); } catch (_) {}
  }
  function renderBoard() {
    const el = $('board'), d = boardData;
    if (!d || d.off || (!d.departures.length && !d.arrivals.length)) { el.classList.add('hidden'); return; }
    if (!d.departures.length) boardSide = 'arr'; else if (!d.arrivals.length) boardSide = 'dep';
    const list = boardSide === 'dep' ? d.departures : d.arrivals;
    el.classList.remove('hidden');
    el.innerHTML = `<div class="bh">${boardSide === 'dep' ? '🛫 Departures' : '🛬 Arrivals'}<span>${d.provider === 'demo' ? 'demo schedule' : 'live'}</span></div><table>` +
      `<colgroup><col class="c-t"><col class="c-n"><col><col class="c-w"><col class="c-s"></colgroup>` + list.map((f, i) => {
        const late = f.estimated && f.estimated !== f.scheduled;
        const where = boardSide === 'dep' ? (f.gate ? `Gate ${esc(f.gate)}` : '') : (f.belt ? `Belt ${esc(f.belt)}` : '');
        return `<tr class="swap" style="animation-delay:${i * 60}ms"><td class="t">${late ? `<s>${hm(f.scheduled)}</s>` : ''}<b>${hm(f.estimated || f.scheduled)}</b></td>` +
          `<td><b>${esc(f.number)}</b></td><td class="city">${esc(f.city || f.city_iata || '')}</td><td>${where}</td>` +
          `<td><span class="fst ${esc(f.status)}">${esc(FST[f.status] || f.status)}</span></td></tr>`;
      }).join('') + '</table>';
  }
  setInterval(() => { if (boardData?.departures?.length && boardData?.arrivals?.length) { boardSide = boardSide === 'dep' ? 'arr' : 'dep'; renderBoard(); } }, 12000);
  setInterval(loadBoard, 60000);

  // ================================================================ assistance requests
  const HELP = { wheelchair: ['♿', 'Wheelchair'], medical: ['🩺', 'Medical help'], lost_item: ['🧳', 'Lost item'], lost_person: ['🧒', 'Lost child / person'],
                 porter: ['🛄', 'Porter / bags'], security: ['🛡️', 'Security'], other: ['💬', 'Talk to staff'] };
  S.ticket = null;
  function showHelp() {
    const b = addMsg('aura', 'How can the team help? Tap one and someone will come to you here.');
    const g = document.createElement('div'); g.className = 'helpgrid';
    g.innerHTML = Object.entries(HELP).map(([k, [i, l]]) => `<button data-k="${k}"><i>${i}</i>${esc(l)}</button>`).join('');
    g.querySelectorAll('button').forEach(x => x.onclick = () => { g.remove(); requestHelp(x.dataset.k, null, 'button'); });
    b.appendChild(g); $('msgs').scrollTop = 1e6;
  }
  async function requestHelp(kind, details, source) {
    touch();
    try {
      const t = await post('/api/assist', { kiosk: KIOSK, kind, details, lang: S.lang, encounter: S.encounter, employee: S.current?.employee, source });
      const el = document.createElement('div'); el.className = 'msg ticket'; el.style.opacity = 1;
      $('msgs').appendChild(el);
      S.ticket = { id: t.id, el, kind, status: t.status };
      renderTicket(t); chime();
      speak(t.status === 'acknowledged' ? 'A team member is on the way.' : 'I have called the team. Please wait here.', 'en-GB');
      pollTicket();
    } catch (e) { addMsg('aura', 'Sorry, I could not reach the team. Please ask at the nearest information desk.'); }
  }
  function renderTicket(t) {
    const [icon, label] = HELP[t.kind] || HELP.other;
    const el = S.ticket.el;
    el.classList.toggle('ack', t.status === 'acknowledged' || t.status === 'done');
    const line = t.status === 'open' ? 'Waiting for a team member… please stay here'
      : t.status === 'acknowledged' ? `${t.assigned ? esc(t.assigned) : 'A team member'} is on the way 🏃`
      : t.status === 'done' ? 'Resolved — have a wonderful journey!' : 'Request cancelled';
    el.innerHTML = `<span class="ti">${icon}</span><div><b>${esc(label)} · request #${t.id}</b><small>${line}</small></div>` +
      (t.status === 'open' ? '<button class="pill ghost" data-c>Cancel</button>' : '');
    const c = el.querySelector('[data-c]');
    if (c) c.onclick = async () => { await post(`/api/assist/${t.id}/cancel`, {}); t.status = 'cancelled'; renderTicket(t); S.ticket = null; };
  }
  async function pollTicket() {
    while (S.ticket && S.chatting) {
      await sleep(4000);
      if (!S.ticket) return;
      try {
        const t = await fetch('/api/assist/' + S.ticket.id).then(r => r.json());
        if (t.status !== S.ticket.status) {
          S.ticket.status = t.status; renderTicket(t);
          if (t.status === 'acknowledged') { chime(); speak(`${t.assigned || 'A team member'} is on the way.`, 'en-GB'); }
        }
        touch();   // keep the screen with the traveller while help is coming
        if (t.status === 'done' || t.status === 'cancelled') { S.ticket = null; return; }
      } catch (_) {}
    }
  }

  // ================================================================ screen states
  let welcomeTimer;
  function clearSay() { $('headline').textContent = ''; $('sub').textContent = ''; $('lines').innerHTML = ''; $('chips').innerHTML = ''; }
  function show(ids) {
    ['actions', 'prompts', 'tools', 'countdown'].forEach(id => $(id).classList.toggle('hidden', !ids.includes(id)));
    document.body.classList.toggle('acting', ids.includes('actions'));   // switches to the two-column layout on landscape screens
  }

  function ambientText() {
    clearInterval(welcomeTimer);
    $('headline').textContent = '';
    $('sub').innerHTML = '';
    $('hint').innerHTML = '<b>Look at me</b> to clock in · <b>tap</b> to ask me anything, in any language';
  }

  function toAmbient() {
    if (S.chatting) closeChat();
    setState('ambient'); clearSay(); show([]);
    S.current = null; S.encounter = null; S.unmatched = 0; S.noFace = 0; S.paused = false; S.deadline = 0;
    S.firstUnmatchedAt = 0; approachAt = 0;
    ambientText(); rotateCard();
  }

  function startCountdown(seconds) {
    S.deadline = Date.now() + seconds * 1000; S.window = seconds * 1000;
  }
  setInterval(() => {
    if (S.chatting && !rec && !S.ticket && Date.now() - S.lastActivity > 60000) return toAmbient();   // walked away mid-chat
    if (!S.deadline) return;
    const left = S.deadline - Date.now();
    $('countdown').querySelector('i').style.transform = `scaleX(${Math.max(0, left / S.window)})`;
    if (left <= 0 && !S.chatting) toAmbient();
  }, 200);
  const extend = () => { if (S.deadline) startCountdown(S.state === 'staff' ? STAFF_TIMEOUT_S : VISITOR_TIMEOUT_S); touch(); };
  document.addEventListener('pointerdown', extend);

  function addLines(lines, delay = 0) {
    lines.forEach((t, i) => {
      const d = document.createElement('div'); d.textContent = t; d.style.animationDelay = `${delay + i * 0.35}s`;
      $('lines').appendChild(d);
    });
  }
  function addChips(chips) {
    $('chips').innerHTML = chips.map((c, i) => `<span class="chip" style="animation-delay:${.4 + i * .12}s">${c.color ? `<span class="sw" style="background:${esc(c.color)}"></span>` : esc(c.icon)} ${esc(c.text)}</span>`).join('');
  }

  // ---- staff recognised
  async function showStaff(j) {
    setState('staff'); S.current = j; S.paused = true; touch();
    dbg.walkup(`Hi, ${j.employee}`);
    const first = j.employee.split(' ')[0];
    clearSay();
    $('headline').textContent = `Hi, ${first}`;
    const lastTxt = j.last_action ? `Last today: ${j.last_action} at ${new Date(j.last_ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : 'No entry yet today';
    $('sub').textContent = lastTxt;
    $('lines').innerHTML = '<div class="shimmer" style="width:70%;opacity:1;animation:sh 1.2s linear infinite"></div><div class="shimmer" style="width:52%;opacity:1;animation:sh 1.2s linear infinite"></div>';
    document.querySelectorAll('#actions button').forEach(b => b.classList.toggle('suggest', b.dataset.a === j.suggested));
    $('typeBtn').classList.add('hidden'); $('notMe').classList.remove('hidden');
    show(['actions', 'tools', 'countdown']);
    startCountdown(STAFF_TIMEOUT_S);
    chime();
    try {
      const g = await post('/api/greet', { employee: j.employee, kiosk: KIOSK, encounter: S.encounter, mood: j.emotion?.label, attire: j.attire });
      if (S.current !== j) return;
      $('headline').textContent = g.headline;
      $('lines').innerHTML = ''; addLines(g.lines); addChips(g.chips || []);
      speak(`${g.headline}. ${g.lines[0] || ''}`);
    } catch (e) {
      $('lines').innerHTML = '';
    }
  }

  // ---- visitor (face, no match)
  function showVisitor() {
    setState('visitor'); touch();
    dbg.walkup('Visitor welcome');
    clearSay();
    let i = 0;
    const w = () => { $('headline').textContent = WELCOME[i++ % WELCOME.length]; };
    w(); clearInterval(welcomeTimer); welcomeTimer = setInterval(() => { if (S.state === 'visitor' && !S.chatting) w(); }, 2200);
    $('sub').textContent = `I'm Aura, your guide at ${S.cfg?.kiosk?.headline || 'the airport'}. Ask me anything — in your language.`;
    $('typeBtn').classList.remove('hidden'); $('notMe').classList.add('hidden');
    show(['prompts', 'tools', 'countdown']);
    startCountdown(VISITOR_TIMEOUT_S);
    beep(660, 90);
  }

  // ================================================================ camera + recognition loop
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
      video.srcObject = stream; await video.play();
      loop(); setInterval(motionTick, MOTION_MS);
    } catch (e) { status(`Camera blocked: ${e.message}. Use HTTPS and allow the camera.`); }
  }

  function grabFrame() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw) return null;
    const scale = FRAME_W / vw;
    cv.width = FRAME_W; cv.height = Math.round(vh * scale);
    cv.getContext('2d').drawImage(video, 0, 0, cv.width, cv.height);
    return new Promise(res => cv.toBlob(res, 'image/jpeg', JPEG_QUALITY));
  }

  // how long to wait before the next frame: fast while someone is arriving, slow otherwise
  function nextScanMs() {
    if (S.state === 'presence') return SCAN_FACE_MS;
    if (S.state === 'ambient') return Date.now() - motionAt < MOTION_HOLD_MS ? SCAN_ACTIVE_MS : SCAN_IDLE_MS;
    return SCAN_VISITOR_MS;
  }

  async function loop() {
    while (true) {
      if (!S.paused && !S.busy) {
        S.busy = true;
        try {
          const t0 = performance.now();
          const blob = await grabFrame();
          if (blob) {
            const t1 = performance.now();
            if (!S.encounter) { S.encounter = uid(); S.frames = 0; approachAt = approachAt || Date.now(); }
            S.frames++;
            const fd = new FormData(); fd.append('file', blob, 'frame.jpg'); fd.append('kiosk', KIOSK); fd.append('encounter', S.encounter);
            // a hung request must never freeze the loop, so every frame gets a hard timeout
            const r = await fetch('/api/recognize', { method: 'POST', body: fd, signal: AbortSignal.timeout(RECOGNIZE_TIMEOUT_MS) });
            const j = await r.json().catch(() => ({ error: `Server error (${r.status})` }));
            dbg.frame({ capture: t1 - t0, rtt: performance.now() - t1, bytes: blob.size, timing: r.headers.get('Server-Timing'), j });
            if (j.error) { status(j.error); S.failures++; }
            else { status(''); S.failures = 0; onResult(j); }
          }
        } catch (e) { status('Server unreachable — retrying'); S.failures++; }
        S.busy = false;
        if (S.failures) { await sleep(Math.min(5000, 500 * S.failures)); continue; }
      }
      await napScan(nextScanMs());
    }
  }

  // a sleep that motionTick can cut short, so someone walking up is scanned straight away
  let wakeScan = null;
  function napScan(ms) {
    return new Promise(res => {
      const t = setTimeout(res, ms);
      wakeScan = () => { clearTimeout(t); res(); };
    }).finally(() => { wakeScan = null; });
  }

  function onResult(j) {
    if (!j.face) {
      S.noFace++;
      // the person who just clocked has walked away: let them be recognised again right away
      if (S.cooldownName && S.noFace >= COOLDOWN_CLEAR_FRAMES) S.cooldownName = null;
      if (S.state === 'presence' && S.noFace >= 3) toAmbient();
      else if (S.state === 'visitor' && S.noFace >= 8 && !S.chatting && Date.now() - S.lastActivity > 6000) toAmbient();
      else if (S.state === 'ambient') {
        S.encounter = null;   // nobody there: next face starts a fresh approach
        if (Date.now() - motionAt >= MOTION_HOLD_MS) approachAt = 0;   // a passer-by, not an arrival
      }
      return;
    }
    // the server only computes mood/clothing on frames that need them, so keep the last known values
    S.noFace = 0; S.face = { ...j, emotion: j.emotion || S.face?.emotion, attire: j.attire || S.face?.attire };
    motionAt = Date.now();   // a face counts as activity
    if (S.alarm) {
      // locked out: the expired-pass holder keeps it up; someone else can take over once the minimum has passed
      if (j.matched && j.pass_expired) return showPassAlert(j);
      if (j.matched && Date.now() - S.alarm.since > ALARM_MIN_MS) { clearPassAlert(); showStaff(j); }
      return;
    }
    if (j.matched && j.pass_expired) return showPassAlert(j);
    if (j.matched) {
      if (j.employee === S.cooldownName && Date.now() < S.cooldownUntil) return;
      if (S.state !== 'staff' && !S.chatting) showStaff(j);
      return;
    }
    if (!S.unmatched++) S.firstUnmatchedAt = Date.now();
    if (S.state === 'ambient') {
      setState('presence'); clearSay();
      $('headline').textContent = 'Hello there';
      $('sub').textContent = 'One moment…';
      $('hint').textContent = '';
    }
    if (S.state === 'presence') {
      if (j.size && j.size < 0.14) $('sub').textContent = 'Step a little closer';
      // frames now arrive ~every 100 ms, so also require a minimum span: someone still turning
      // towards the camera shouldn't be called a visitor before their face is usable
      if (S.unmatched >= 3 && Date.now() - S.firstUnmatchedAt >= VISITOR_MIN_MS) showVisitor();
    }
  }

  // ---- human activity: cheap frame differencing on a 32x24 thumbnail, so the screen reacts to someone
  // walking up before the face detector has a usable face. Pixels stay in this tab.
  const mcv = document.createElement('canvas'); mcv.width = 32; mcv.height = 24;
  const mctx = mcv.getContext('2d', { willReadFrequently: true });
  let prevLuma = null, motionAt = 0;
  function motionTick() {
    if (!video.videoWidth || document.hidden) return;
    mctx.drawImage(video, 0, 0, mcv.width, mcv.height);
    const px = mctx.getImageData(0, 0, mcv.width, mcv.height).data, n = mcv.width * mcv.height;
    const luma = new Uint8Array(n);
    let changed = 0;
    for (let i = 0; i < n; i++) {
      luma[i] = (px[i * 4] * 77 + px[i * 4 + 1] * 150 + px[i * 4 + 2] * 29) >> 8;
      if (prevLuma && Math.abs(luma[i] - prevLuma[i]) > 28) changed++;
    }
    prevLuma = luma;
    if (changed / n > 0.04) {
      const wasStill = Date.now() - motionAt >= MOTION_HOLD_MS;
      motionAt = Date.now();
      if (wasStill && S.state === 'ambient') {
        approachAt = Date.now();   // start of a walk-up, for the ?debug=1 overlay
        if (wakeScan) wakeScan();  // someone just stepped in: scan now
      }
    }
    setActivity(Date.now() - motionAt < MOTION_HOLD_MS);
  }
  function setActivity(on) {
    if (document.body.classList.contains('activity') === on) return;
    document.body.classList.toggle('activity', on);
  }

  // ================================================================ expired security pass
  // Full-screen red lockout + siren. Nothing on the kiosk can be pressed while it is up; the server
  // refuses the actions anyway and has already logged the incident as a supervisor alert.
  const SIREN_S = 20;            // how long the siren wails for one approach
  const ALARM_MIN_MS = 12000;    // keep the lockout up at least this long
  const ALARM_CLEAR_MS = 6000;   // ...then clear once the person has been out of view this long
  let siren = null;
  function startSiren() {
    stopSiren();
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume();
      const g = actx.createGain(), t0 = actx.currentTime;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.15);
      g.gain.setValueAtTime(0.5, t0 + SIREN_S - 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t0 + SIREN_S);
      g.connect(actx.destination);
      const oscs = [0, 7].map(detune => {           // two slightly detuned saws: harsh and loud on small speakers
        const o = actx.createOscillator(); o.type = 'sawtooth'; o.detune.value = detune * 100 / 12;
        for (let t = 0; t < SIREN_S; t += 1.2) {      // wail: 600 Hz -> 1400 Hz -> 600 Hz
          o.frequency.setValueAtTime(600, t0 + t);
          o.frequency.linearRampToValueAtTime(1400, t0 + t + 0.6);
          o.frequency.linearRampToValueAtTime(600, t0 + t + 1.2);
        }
        o.connect(g); o.start(t0); o.stop(t0 + SIREN_S); return o;
      });
      siren = { oscs, g };
    } catch (_) {}
  }
  function stopSiren() {
    if (!siren) return;
    try { siren.oscs.forEach(o => o.stop()); siren.g.disconnect(); } catch (_) {}
    siren = null;
  }

  function showPassAlert(j) {
    if (S.alarm && S.alarm.name === j.employee) { S.alarm.lastSeen = Date.now(); return; }
    if (S.chatting) closeChat();
    $('safety').classList.remove('show'); $('done').classList.remove('show');
    setState('alarm'); clearSay(); show([]);
    S.current = null; S.deadline = 0; S.paused = false;   // keep scanning so we know when they leave
    S.alarm = { name: j.employee, since: Date.now(), lastSeen: Date.now() };
    const exp = j.pass_expiry ? new Date(j.pass_expiry + 'T00:00').toLocaleDateString([], { day: 'numeric', month: 'long', year: 'numeric' }) : '';
    $('paWho').textContent = j.employee;
    $('paS').textContent = `This security pass expired${exp ? ` on ${exp}` : ''}. Access denied — no attendance or clock-in actions can be recorded. ` +
      'Do not enter restricted areas. Report to the Security Pass Office or your supervisor immediately.';
    $('passAlert').classList.add('show');
    if (document.activeElement) document.activeElement.blur();
    startSiren();
    speak(`Warning. Security pass expired. Access denied. ${j.employee.split(' ')[0]}, please report to the security pass office.`);
  }
  function clearPassAlert() {
    stopSiren();
    if (window.speechSynthesis) speechSynthesis.cancel();
    $('passAlert').classList.remove('show');
    S.alarm = null;
    toAmbient();
  }
  setInterval(() => {
    const a = S.alarm;
    if (a && Date.now() - a.since > ALARM_MIN_MS && Date.now() - a.lastSeen > ALARM_CLEAR_MS) clearPassAlert();
  }, 500);
  // swallow every interaction while locked out (capture phase, before any button handler)
  ['pointerdown', 'click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, e => {
    if (!S.alarm) return;
    e.preventDefault(); e.stopImmediatePropagation();
  }, { capture: true, passive: false }));

  // ================================================================ attendance actions
  async function post(url, body) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return j;
  }

  const LABEL = { IN: 'Clocked in', BREAK: 'Enjoy your break', BACK: 'Welcome back', OUT: 'Clocked out' };
  const COLOR = { IN: 'var(--in)', BREAK: 'var(--break)', BACK: 'var(--back)', OUT: 'var(--out)' };
  document.querySelectorAll('#actions button').forEach(btn => btn.onclick = async () => {
    const j = S.current; if (!j || j.pass_expired || S.alarm) return;
    const action = btn.dataset.a;
    S.deadline = 0;
    let safetyOut = null;
    if (action === 'IN') {
      try {
        const pre = await post('/api/safety/precheck', { employee: j.employee, kiosk: KIOSK, hivis: j.attire?.hivis ?? null });
        if (pre.required) {
          safetyOut = await safetySheet(j, pre);
          if (!safetyOut) { startCountdown(STAFF_TIMEOUT_S); return; }   // cancelled
        }
      } catch (_) { /* safety service unavailable: never block clocking in */ }
    }
    try {
      const r = await post('/api/event', { employee: j.employee, action, kiosk: KIOSK, similarity: j.similarity, mood: j.emotion?.label, attire: j.attire?.name });
      const time = new Date(r.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      let line = r.duplicate ? 'Already recorded a moment ago.' : '';
      if (!r.duplicate) {
        try {
          const g = await post('/api/greet', { employee: j.employee, kiosk: KIOSK, encounter: S.encounter, mood: j.emotion?.label, attire: j.attire, action });
          line = (g.lines || []).find(l => /early|time|streak|break|back|shift|rest|late|mile/i.test(l)) || g.lines[0] || '';
        } catch (_) {}
      }
      if (safetyOut && safetyOut.result === 'flagged') {
        const bits = [];
        if (safetyOut.missing.length) bits.push(`Missing: ${safetyOut.missing.map(k => S.ppeLabels[k] || k).join(', ')} — please collect before going airside.`);
        if (safetyOut.fatigue?.level === 'high') bits.push('Fatigue risk is HIGH — your supervisor has been told. Look after yourself today.');
        line = bits.join(' ') + ' Supervisor notified.';
        flash(`${LABEL[action]} · ${time}`, line, '#d97706');
        beep(440, 200, 'triangle'); speak(`${LABEL[action]}. ${line}`);
      } else {
        if (safetyOut) line = `Safety check passed ✓ ${line}`;
        flash(`${LABEL[action]} · ${time}`, line, COLOR[action]);
        chime(); speak(`${LABEL[action]}, ${j.employee.split(' ')[0]}. ${line}`);
      }
      S.cooldownName = j.employee; S.cooldownUntil = Date.now() + COOLDOWN_MS;
      setTimeout(toAmbient, 3600);
    } catch (e) {
      flash('Not saved', e.message, 'var(--out)'); beep(220, 300, 'square');
      setTimeout(toAmbient, 3000);
    }
  });

  // ---- ramp safety pack: PPE checklist + restedness, resolves with the recorded check (or null if cancelled)
  S.ppeLabels = {};
  function safetySheet(j, pre) {
    return new Promise(resolve => {
      const el = $('safety'), sheet = el.querySelector('.sheet');
      const items = {}; let rested = null;
      pre.items.forEach(it => { S.ppeLabels[it.key] = it.label; items[it.key] = it.auto === true ? 'ok' : 'missing'; });
      const fat = pre.fatigue;
      const faces = [[1, '😫', 'Exhausted'], [2, '😴', 'Tired'], [3, '😐', 'OK'], [4, '🙂', 'Rested'], [5, '😄', 'Very rested']];
      sheet.innerHTML = `<h2>Safety check</h2><div class="sub">${esc(j.employee.split(' ')[0])} · ${esc(pre.department || '')} — confirm before going airside</div>` +
        (pre.items.length ? `<h3>Your PPE</h3><div class="ppe">${pre.items.map(it => `<button data-k="${esc(it.key)}" class="${it.auto === true ? 'on' : it.auto === false ? 'warn' : ''}"><i>${it.icon}</i>${esc(it.label)}` +
          `<small>${it.auto === true ? 'seen by camera' : it.auto === false ? 'not seen — please put it on' : 'tap to confirm'}</small></button>`).join('')}</div>` : '') +
        (pre.ask_rested ? `<h3>How rested do you feel?</h3><div class="rest">${faces.map(([v, e, l]) => `<button data-r="${v}"><i>${e}</i>${l}</button>`).join('')}</div>` : '') +
        (fat ? `<div class="risk">Fatigue risk from your roster: <b class="${fat.level}">${fat.level.toUpperCase()}</b>${fat.factors.length ? `<ul>${fat.factors.map(f => `<li>${esc(f.text)}</li>`).join('')}</ul>` : ' — well rested, nice.'}</div>` : '') +
        `<div class="go"><button class="pill ghost" data-x>Cancel</button><button class="pill primary" data-ok>Confirm &amp; clock in</button></div>`;
      const okBtn = sheet.querySelector('[data-ok]');
      const refresh = () => {
        const missing = Object.values(items).filter(v => v !== 'ok').length;
        okBtn.disabled = pre.ask_rested && rested == null;
        okBtn.style.opacity = okBtn.disabled ? .5 : 1;
        okBtn.textContent = missing ? `Clock in · report ${missing} missing` : 'Confirm & clock in';
      };
      sheet.querySelectorAll('.ppe button').forEach(b => b.onclick = () => {
        touch(); const k = b.dataset.k; items[k] = items[k] === 'ok' ? 'missing' : 'ok';
        b.classList.toggle('on', items[k] === 'ok'); b.classList.remove('warn'); refresh();
      });
      sheet.querySelectorAll('.rest button').forEach(b => b.onclick = () => {
        touch(); rested = +b.dataset.r; sheet.querySelectorAll('.rest button').forEach(x => x.classList.toggle('on', x === b)); refresh();
      });
      const close = v => { el.classList.remove('show'); clearTimeout(idle); resolve(v); };
      sheet.querySelector('[data-x]').onclick = () => close(null);
      okBtn.onclick = async () => {
        if (okBtn.disabled) return;
        okBtn.disabled = true;
        try { close(await post('/api/safety/check', { employee: j.employee, kiosk: KIOSK, items, hivis: j.attire?.hivis ?? null, rested })); }
        catch (_) { close({ result: 'pass', missing: [], fatigue: null }); }
      };
      const idle = setTimeout(() => close(null), 90000);
      refresh(); el.classList.add('show');
      speak(pre.items.length ? 'Quick safety check. Confirm your P P E.' : 'Quick check: how rested do you feel?');
    });
  }

  function flash(t, s, color) {
    $('doneT').textContent = t; $('doneS').textContent = s;
    $('done').style.setProperty('--c', color); $('done').style.background = color;
    $('done').classList.add('show');
    setTimeout(() => $('done').classList.remove('show'), 3200);
  }

  $('notMe').onclick = () => { S.cooldownName = S.current?.employee; S.cooldownUntil = Date.now() + COOLDOWN_MS; toAmbient(); };

  // ================================================================ conversation
  function openChat() {
    S.chatting = true; document.body.classList.add('chatting'); touch();
    S.deadline = 0;
    $('chatWho').textContent = S.current ? `· with ${S.current.employee.split(' ')[0]}` : '· I reply in your language';
    if (!$('msgs').children.length) {
      addMsg('aura', S.current ? `What's on your mind, ${S.current.employee.split(' ')[0]}?` : 'Hi! Ask me anything — speak or type in any language.');
    }
  }
  function closeChat() {
    S.chatting = false; document.body.classList.remove('chatting'); stopRec(true); S.ticket = null;
    $('msgs').innerHTML = '';
    if (S.state === 'staff') startCountdown(STAFF_TIMEOUT_S);
    else if (S.state === 'visitor') startCountdown(VISITOR_TIMEOUT_S);
    else toAmbient();
  }
  $('closeChat').onclick = closeChat;
  $('talkBtn').onclick = () => { openChat(); record(); };
  $('typeBtn').onclick = () => { openChat(); setTimeout(() => $('text').focus(), 350); };
  document.getElementById('center').addEventListener('click', e => {
    if (S.state === 'ambient' && e.target.closest('#orbWrap')) { showVisitor(); openChat(); }
  });
  $('ambient').onclick = () => { if (S.state === 'ambient') { showVisitor(); openChat(); } };

  function addMsg(who, html, meta) {
    const d = document.createElement('div'); d.className = `msg ${who}`;
    d.innerHTML = html + (meta ? `<span class="meta">${esc(meta)}</span>` : '');
    $('msgs').appendChild(d); $('msgs').scrollTop = 1e6;
    return d;
  }
  function typeInto(el, text) {
    return new Promise(res => {
      let i = 0; el.textContent = '';
      const t = setInterval(() => { el.textContent = text.slice(0, i += 2); $('msgs').scrollTop = 1e6; if (i >= text.length) { clearInterval(t); res(); } }, 18);
    });
  }

  async function send(text, viaVoice) {
    text = (text || '').trim(); if (!text) return;
    touch();
    if (!viaVoice) addMsg('me', esc(text));
    S.lastText = text;
    $('text').value = '';
    const bubble = addMsg('aura', '<span class="typing"><i></i><i></i><i></i></span>');
    const prev = S.state; setState('thinking');
    try {
      const r = await post('/api/talk', { text, kiosk: KIOSK, encounter: S.encounter, employee: S.current?.employee, mood: S.face?.emotion?.label, channel: 'text' });
      await answer(bubble, r);
    } catch (e) { bubble.textContent = 'Sorry, I lost my train of thought. Try again?'; }
    setState(prev === 'thinking' ? 'visitor' : prev);
  }
  async function answer(bubble, r) {
    const span = document.createElement('span'); bubble.innerHTML = ''; bubble.appendChild(span);
    speak(r.reply, r.locale);
    await typeInto(span, r.reply);
    if (r.flight) {
      const f = r.flight, fc = document.createElement('div'); fc.className = 'fcard';
      fc.innerHTML = `<b>${f.dir === 'dep' ? '🛫' : '🛬'} ${esc(f.number)}</b><span>${esc(f.airline || '')} · ${f.dir === 'dep' ? 'to' : 'from'} ${esc(f.city || '')}</span>` +
        `<span class="fst ${esc(f.status)}">${esc(FST[f.status] || f.status)}</span>` +
        `<span class="big">${hm(f.estimated || f.scheduled)}</span><span>${f.estimated && f.estimated !== f.scheduled ? `was ${hm(f.scheduled)}` : 'scheduled'}</span>` +
        `<span>${f.dir === 'dep' ? (f.gate ? `Gate <b>${esc(f.gate)}</b>` : '') : (f.belt ? `Belt <b>${esc(f.belt)}</b>` : '')}</span>`;
      bubble.appendChild(fc);
    }
    if (r.assist && !S.ticket) {
      const [icon, label] = HELP[r.assist] || HELP.other;
      const hb = document.createElement('button'); hb.className = 'helpbtn'; hb.innerHTML = `📣 Call a team member · ${icon} ${esc(label)}`;
      hb.onclick = () => { hb.remove(); requestHelp(r.assist, r.heard || S.lastText, 'conversation'); };
      bubble.appendChild(hb);
    }
    const m = document.createElement('span'); m.className = 'meta'; m.textContent = `${(r.lang || '').toUpperCase()} · ${r.intent || ''}`;
    bubble.appendChild(m);
    S.lang = r.lang || S.lang;
    $('msgs').scrollTop = 1e6;
  }
  $('send').onclick = () => send($('text').value);
  $('text').onkeydown = e => { if (e.key === 'Enter') send($('text').value); };
  $('text').oninput = touch;

  // ---- voice: record a clip, the server's Whisper detects the language
  let rec = null;
  $('mic').onclick = () => rec ? stopRec() : record();

  async function record() {
    if (rec) return;
    if (window.speechSynthesis) speechSynthesis.cancel();
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch (e) { addMsg('aura', 'I can’t hear you — microphone access is blocked. You can type instead.'); return; }
    const mime = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    const chunks = []; mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaStreamSource(stream), an = actx.createAnalyser(); an.fftSize = 1024; src.connect(an);
    const buf = new Float32Array(an.fftSize);
    let spoke = false, quietSince = Date.now(); const started = Date.now();
    rec = { mr, stream, cancelled: false };
    $('mic').classList.add('rec'); setState('listening'); touch();
    const meter = setInterval(() => {
      an.getFloatTimeDomainData(buf);
      const rms = Math.sqrt(buf.reduce((s, v) => s + v * v, 0) / buf.length);
      $('level').querySelector('i').style.width = Math.min(100, rms * 900) + '%';
      if (rms > 0.03) { spoke = true; quietSince = Date.now(); }
      const quiet = Date.now() - quietSince;
      if ((spoke && quiet > 800) || Date.now() - started > 15000 || (!spoke && Date.now() - started > 7000)) stopRec();
    }, 80);
    mr.onstop = async () => {
      clearInterval(meter); $('level').querySelector('i').style.width = '0';
      stream.getTracks().forEach(t => t.stop()); $('mic').classList.remove('rec');
      const cancelled = rec?.cancelled; rec = null;
      setState(S.current ? 'staff' : 'visitor');
      if (cancelled || !spoke || !chunks.length) return;
      const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
      const mine = addMsg('me', '<span class="typing"><i></i><i></i><i></i></span>');
      setState('thinking');
      const fd = new FormData();
      fd.append('file', blob, (mr.mimeType || '').includes('mp4') ? 'voice.mp4' : 'voice.webm');
      fd.append('kiosk', KIOSK); fd.append('encounter', S.encounter || '');
      if (S.current) fd.append('employee', S.current.employee);
      if (S.face?.emotion?.label) fd.append('mood', S.face.emotion.label);
      try {
        const r = await fetch('/api/listen', { method: 'POST', body: fd }).then(x => x.json());
        if (r.error) throw new Error(r.error);
        if (!r.transcript) { mine.remove(); addMsg('aura', 'I didn’t quite catch that — could you say it again?'); }
        else {
          mine.textContent = r.transcript; S.lastText = r.transcript;
          const b = addMsg('aura', '<span class="typing"><i></i><i></i><i></i></span>');
          await answer(b, r);
        }
      } catch (e) {
        mine.remove(); addMsg('aura', 'My ears are offline right now — please type your question.');
      }
      setState(S.current ? 'staff' : 'visitor'); touch();
    };
    mr.start(250);
  }
  function stopRec(cancel) {
    if (!rec) return;
    rec.cancelled = !!cancel;
    try { rec.mr.state !== 'inactive' && rec.mr.stop(); } catch (_) {}
  }

  // ================================================================ start-up
  function start() {
    $('start').classList.add('hidden');
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (_) {}
    if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
    startCamera();
  }
  $('start').onclick = start;
  if (q.get('autostart') === '1') start();

  // iPadOS pauses media on tab switches; resume when visible again
  document.addEventListener('visibilitychange', () => { if (!document.hidden && video.paused) video.play().catch(() => {}); });

  toAmbient();
  loadConfig(); setInterval(loadConfig, 60000);
  loadBoard();
})();
</script>
</body>
</html>
