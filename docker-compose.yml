# Face Attendance stack (ARM-native)
#  - recognizer : OpenCV YuNet + SFace face recognition (runs natively on Apple Silicon)
#  - recognizer : also returns emotion (FER+) and clothing colour for the face in front of the kiosk
#  - listener   : speech -> text + language (faster-whisper, local)
#  - attendance : Aura kiosk, admin, insights, attendance log, CSV export, conversation brain
#  - caddy      : HTTPS in front of attendance (iPad Safari needs HTTPS for the camera + mic)
#
# This replaces the earlier CompreFace-based stack: CompreFace ships x86-only ML images that
# need AVX, which Apple Silicon (Rosetta) doesn't provide, so its core never became healthy.

volumes:
  attendance-data:
  recognizer-data:
  listener-models:
  caddy-data:
  caddy-config:

services:
  recognizer:
    build: ./recognizer
    restart: always
    container_name: "recognizer"
    environment:
      - TZ=${TZ:-Indian/Maldives}   # "today" for the daily best photos
      # keep each recognised person's best photos per day, for a week (see README "Enrol staff")
      - DAILY_BEST=${DAILY_BEST:-2}
      - DAILY_KEEP_DAYS=${DAILY_KEEP_DAYS:-7}
      - LEARN_MIN_SIMILARITY=${LEARN_MIN_SIMILARITY:-0.45}
      - LEARN_MARGIN=${LEARN_MARGIN:-0.08}
      - LEARN_ANCHOR_SIMILARITY=${LEARN_ANCHOR_SIMILARITY:-0.28}
    volumes:
      - recognizer-data:/data
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8182:8000"   # local debugging: http://localhost:8182/healthcheck

  listener:
    build: ./listener
    restart: always
    container_name: "listener"
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8183:8000"   # local debugging: http://localhost:8183/healthcheck

  attendance:
    build: ./attendance
    restart: always
    container_name: "attendance"
    environment:
      - COMPREFACE_URL=http://recognizer:8000
      # any value works; the recognizer ignores the key. Kept for compatibility.
      - COMPREFACE_API_KEY=local
      # SFace cosine similarity to accept a match (0..1). ~0.35 is a good start for SFace.
      # Hardcoded here (not from .env) so it matches the recognizer's scale out of the box.
      - SIMILARITY_THRESHOLD=0.35
      - DUPLICATE_WINDOW_SECONDS=${DUPLICATE_WINDOW_SECONDS:-60}
      - ADMIN_PIN=${ADMIN_PIN:-2468}
      - TZ=${TZ:-Indian/Maldives}
      - DB_PATH=/data/attendance.db
      - MEDIA_DIR=/data/media
      - LISTENER_URL=http://listener:8000
      # ---- Aura: conversation + insights (values come from .env; see .env.example) ----
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-claude-opus-5}
      - AIRPORT_NAME=${AIRPORT_NAME:-Velana International Airport}
      - WIFI_INFO=${WIFI_INFO:-network “Airport-Free-WiFi”, no password}
      - UNIFORM_COLORS=${UNIFORM_COLORS:-}
      - WEEKEND_DAYS=${WEEKEND_DAYS:-fri,sat}
      - SHIFT_START=${SHIFT_START:-08:00}
      - LATE_GRACE_MINUTES=${LATE_GRACE_MINUTES:-5}
      - MOOD_TRACKING=${MOOD_TRACKING:-on}
      - INTERACTION_RETENTION_DAYS=${INTERACTION_RETENTION_DAYS:-365}
      - ADAPTIVE_LEARNING=${ADAPTIVE_LEARNING:-on}
      # ---- live flights + assistance requests ----
      - FLIGHT_PROVIDER=${FLIGHT_PROVIDER:-}
      - FLIGHT_AIRPORT=${FLIGHT_AIRPORT:-MLE}
      - AERODATABOX_KEY=${AERODATABOX_KEY:-}
      - AERODATABOX_RAPIDAPI_KEY=${AERODATABOX_RAPIDAPI_KEY:-}
      - FLIGHT_FEED_URL=${FLIGHT_FEED_URL:-}
      - FLIGHT_REFRESH_SECONDS=${FLIGHT_REFRESH_SECONDS:-180}
      - ASSIST_PIN=${ASSIST_PIN:-}
      - ASSIST_WEBHOOK_URL=${ASSIST_WEBHOOK_URL:-}
      - ASSIST_SLA_MINUTES=${ASSIST_SLA_MINUTES:-5}
      - SAFETY_WEBHOOK_URL=${SAFETY_WEBHOOK_URL:-}
      - HIVIS_MIN_SHARE=${HIVIS_MIN_SHARE:-0.12}
      # ---- roster + supervisor alerts ----
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_SCAN_SECONDS=${ALERT_SCAN_SECONDS:-60}
      - NO_SHOW_MINUTES=${NO_SHOW_MINUTES:-15}
      - LATE_ALERT_MINUTES=${LATE_ALERT_MINUTES:-10}
      - CLOCKOUT_GRACE_MINUTES=${CLOCKOUT_GRACE_MINUTES:-60}
      - BREAK_MAX_MINUTES=${BREAK_MAX_MINUTES:-60}
      - UNDERSTAFF_MIN=${UNDERSTAFF_MIN:-2}
      - EARLY_LEAVE_MINUTES=${EARLY_LEAVE_MINUTES:-15}
    volumes:
      - attendance-data:/data
      # serve the screens straight from the repo so UI edits go live on refresh (no image rebuild)
      - ./attendance/static:/app/static:ro
    depends_on:
      - recognizer
      - listener
    ports:
      - "8181:8080"   # this Mac, no HTTPS needed (localhost is a secure origin for camera/mic):
                      #   kiosk http://localhost:8181/?kiosk=Staff-Entrance · admin http://localhost:8181/admin

  caddy:
    image: caddy:2-alpine
    restart: always
    container_name: "caddy"
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - attendance
